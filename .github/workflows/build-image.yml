name: build-bot-host-image

# Build + push the 24/7 bot-host container image to GHCR on every push to main.
# The cluster (Argo app fiesta-bot-host, ns bots) pulls
# ghcr.io/ikaronclaude/fiesta-bot-host:<tag>; deploy by bumping the tag in
# gitops-ikaron workloads/fiesta-bots/bots.yaml to the pushed sha. Uses the
# repo's GITHUB_TOKEN (packages: write) — no external registry creds needed.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: build-bot-host-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive   # lib/FiestaLib-Reloaded is a submodule the build needs

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (sha + latest tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/fiesta-bot-host
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
