<!doctype html>
<meta charset="utf-8">
<title>bot watch</title>
<style>
  :root { --bg:#0e1116; --panel:#161b22; --line:#232a34; --fg:#c9d1d9; --dim:#7d8590;
          --ok:#3fb950; --warn:#d29922; --crit:#f85149; --accent:#58a6ff; }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--fg); font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace }
  header { display:flex; gap:12px; align-items:center; padding:8px 12px; border-bottom:1px solid var(--line) }
  header input,header select { background:var(--panel); color:var(--fg); border:1px solid var(--line); padding:4px 6px; border-radius:4px; font:inherit }
  /* Constrain the page: on a wide monitor the panels stretched to unreadable line lengths. */
  .wrap { display:grid; grid-template-columns: 320px minmax(0,1fr); gap:10px; padding:10px;
          align-items:start; max-width:1400px; margin:0 auto }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:10px }
  h2 { margin:0 0 8px; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--dim) }
  .kv { display:grid; grid-template-columns:auto 1fr; gap:2px 10px }
  .kv div:nth-child(odd) { color:var(--dim) }
  .bar { height:6px; background:#0b0e13; border-radius:3px; overflow:hidden; margin:3px 0 7px }
  .bar > i { display:block; height:100%; background:var(--ok) }
  table { width:100%; border-collapse:collapse }
  th,td { text-align:right; padding:2px 5px; border-bottom:1px solid var(--line); white-space:nowrap }
  th:first-child,td:first-child { text-align:left }
  th { color:var(--dim); font-weight:normal; position:sticky; top:0; background:var(--panel) }
  #log { height:320px; overflow:auto; background:#0b0e13; border:1px solid var(--line); border-radius:6px; padding:6px; white-space:pre-wrap; word-break:break-word }
  .l-note{color:#e6edf3} .l-info{color:#8b949e} .l-verb{color:#6e7681}
  .hit-crit{color:var(--crit);font-weight:bold} .hit-warn{color:var(--warn)} .hit-ok{color:var(--ok)}
  canvas { width:100%; background:#0b0e13; border:1px solid var(--line); border-radius:6px; display:block }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap }
  .muted { color:var(--dim) }
  .err { color:var(--crit) }

  /* ── skill tiles: an MMO action bar. 8 per row, so 24 learned skills = 3 rows. ──────────────────
     State is carried the way a game client carries it, not as a table column:
       • READY      → lit border
       • COOLING    → dim border + seconds remaining + a radial sweep darkening the remaining fraction
       • UNKNOWN cd → dashed border. A skill whose DelayTime we cannot read must NOT look ready. */
  /* 75% of the old width, 50% of the old height (was a 1:1 square filling 1/8 of the row). */
  .tiles { display:grid; grid-template-columns:repeat(8, minmax(0,0.75fr)); gap:5px; justify-content:start }
  .tile { position:relative; aspect-ratio:1.5; border-radius:4px; background:#0b0e13;
          border:2px solid #2b3440; overflow:hidden; display:flex; align-items:center; justify-content:center;
          padding:1px; text-align:center; cursor:default }
  .tile .nm { font-size:12px; line-height:1.1; color:var(--fg); word-break:break-word; z-index:2;
              display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden }
  .tile.ready { border-color:var(--ok); box-shadow:0 0 4px rgba(63,185,80,.35) }
  .tile.cool  { border-color:#3d444d }
  .tile.cool .nm { color:var(--dim) }
  .tile.unk   { border-style:dashed; border-color:var(--warn) }
  .tile .cd { position:absolute; bottom:1px; right:2px; font-size:9px; color:var(--warn); z-index:3 }
  /* the radial sweep: conic-gradient darkens the portion of the cooldown still to run */
  .tile .sweep { position:absolute; inset:0; z-index:1; pointer-events:none }

  .maps { display:grid; grid-template-columns:1fr 1fr; gap:10px; max-width:660px }  /* 1.5x the -33% pass */

  /* Foldable cards. Default OPEN; the open/closed choice persists in localStorage. */
  h2.fold { cursor:pointer; user-select:none; display:flex; align-items:center; gap:6px }
  h2.fold .chev { display:inline-block; transition:transform .15s; font-size:10px }
  .panel.closed h2.fold .chev { transform:rotate(-90deg) }
  .panel.closed .body { display:none }
  .skopts { display:flex; gap:12px; font-size:11px; color:var(--dim); margin:0 0 6px }
  .skopts label { display:flex; align-items:center; gap:4px; cursor:pointer }

  /* fold-out death reports under the console */
  #deaths { max-height:300px; overflow:auto; margin-top:6px }
  #deaths details { border:1px solid var(--line); border-radius:5px; margin-bottom:5px; background:#0b0e13 }
  #deaths summary { cursor:pointer; padding:4px 6px; color:var(--crit) }
  #deaths pre { margin:0; padding:6px; white-space:pre-wrap; word-break:break-word; color:var(--dim); font-size:11px }

  /* toaster — bottom-right, newest on top, auto-expiring */
  #toasts { position:fixed; right:14px; bottom:14px; display:flex; flex-direction:column-reverse; gap:6px; z-index:50 }
  .toast { background:#161b22; border:1px solid var(--line); border-left:3px solid var(--accent);
           border-radius:5px; padding:6px 10px; box-shadow:0 2px 10px rgba(0,0,0,.45);
           animation:tin .18s ease-out; max-width:360px }
  .toast.kill  { border-left-color:var(--accent) }
  .toast.goal  { border-left-color:var(--warn) }
  .toast.hand  { border-left-color:var(--ok) }
  .toast .q { color:var(--fg) } .toast .sep { color:var(--dim); margin:0 6px }
  @keyframes tin { from { opacity:0; transform:translateY(6px) } to { opacity:1; transform:none } }
  /* Fixed height, not auto: the legend's line count changes with whatever wandered into view, and an
     auto-height box shifted every panel below it up and down on a 5/sec redraw. Reserve the space and
     scroll inside it instead. */
  .legend { margin-top:6px; display:flex; flex-wrap:wrap; align-content:flex-start; gap:4px 10px;
            font-size:11px; color:var(--dim); height:78px; overflow-y:auto }
  .legend b { color:var(--fg); font-weight:normal }
  /* The global `th,td { white-space:nowrap }` made this table refuse to wrap, so a long status string
     ("instance-only (Tower of Iyzel) — needs a party; shelved") forced the panel far wider than the
     screen while the rest of the row sat empty. Fixed layout + wrapping keeps it inside the card. */
  #quests { table-layout:fixed; width:100% }
  #quests td { white-space:normal; overflow-wrap:anywhere }
  #quests col.c-name { width:auto }
  #quests col.c-num  { width:88px }
  #quests col.c-stat { width:34% }
  #quests col.c-here { width:70px }
  tr.qh td { border-bottom:none; padding-top:6px }
  tr.qg td { color:var(--dim); font-size:11px; border-bottom:1px solid var(--line) }
  tr.qfocus td { background:rgba(88,166,255,.08) }
  .focus { border:1px solid var(--line); border-left:3px solid var(--accent); border-radius:5px;
           background:#0b0e13; padding:5px 8px; margin-bottom:6px; font-size:12px }
  button.mini { background:#0b0e13; color:var(--dim); border:1px solid var(--line); border-radius:3px;
                font:inherit; font-size:10px; padding:0 5px; cursor:pointer; margin-left:6px }
  button.mini:hover { color:var(--fg); border-color:var(--accent) }
</style>

<header>
  <strong>bot watch</strong>
  <!-- A DROPDOWN of the bots that actually exist, not a name to retype. With several bots running at
       once, typing an id to switch is both slow and silently wrong when you fat-finger it — a bad name
       just makes every panel 404 with no hint that the NAME is what is wrong. -->
  <label>bot <select id="bot"></select></label>
  <button class="mini" id="relogbtn" onclick="relogBot()"
    title="Clean logout → re-login in place, re-applying the same script. The recovery for a wedged bot.
⚠️ The bot 404s for a few seconds while the handle is replaced, and its ring buffer RESTARTS EMPTY — copy anything you need from the log first.">relog</button>
  <label>token <input id="tok" type="password" size="16" placeholder="bearer"></label>
  <label>log level
    <select id="lvl"><option>note</option><option selected>info</option><option>verbose</option></select>
  </label>
  <label>map <select id="mapsel"><option value="">(current)</option></select></label>
  <label><input type="checkbox" id="recent" checked> heatmap: last 30m only</label>
  <span id="status" class="muted"></span>
</header>

<div id="toasts"></div>

<div class="wrap">
  <div>
    <div class="panel" style="margin-bottom:10px">
      <h2 class="fold" data-card="live"><span class="chev">▼</span>live</h2>
      <div class="body"><div id="vitals"></div></div>
    </div>
    <div class="panel">
      <h2 class="fold" data-card="character"><span class="chev">▼</span>character</h2>
      <div class="body"><div id="charsheet"></div></div>
    </div>
  </div>

  <div>
    <div class="panel" style="margin-bottom:10px">
      <h2 class="fold" data-card="skills"><span class="chev">▼</span>skills <span class="muted" id="skhint"></span></h2>
      <div class="body">
        <div class="skopts">
          <label><input type="checkbox" id="skmisc"> show misc</label>
          <label><input type="checkbox" id="sklevels"> show all levels</label>
        </div>
        <div id="skills" class="tiles"></div>
      </div>
    </div>

    <div class="panel" style="margin-bottom:10px">
      <h2 class="fold" data-card="maps"><span class="chev">▼</span>maps <span class="muted" id="mapname"></span></h2>
      <div class="body">
      <div class="maps">
        <div>
          <div class="muted" style="margin-bottom:4px">big map — where it's been</div>
          <canvas id="heat" width="320" height="320"></canvas>
          <div id="mapinfo" class="muted" style="margin-top:6px"></div>
        </div>
        <div>
          <div class="muted" style="margin-bottom:4px">combat map — self centred, <span id="cmscale"></span>
            <select id="cmzoom" style="margin-left:6px;background:#0b0e13;color:#e6edf3;border:1px solid #1b2430;font:inherit">
              <option value="150">150u — contact</option>
              <option value="300">300u — melee</option>
              <option value="900" selected>900u — engagement</option>
              <option value="2500">2500u — area</option>
              <option value="8000">8000u — region</option>
            </select></div>
          <canvas id="combat" width="320" height="320"></canvas>
          <div id="legend" class="legend"></div>
        </div>
      </div>
      </div>
    </div>

    <div class="panel" style="margin-bottom:10px">
      <h2 class="fold" data-card="quests"><span class="chev">▼</span>quests <span class="muted" id="qhint"></span></h2>
      <div class="body">
        <!-- The DRIVER's own statement of intent, above the board. The board's ORDER only mirrors the
             driver's sort, so without this there is no way to tell which quest it actually picked, or
             why it is walking somewhere. -->
        <div id="focus" class="focus"></div>
        <div style="max-height:220px; overflow:auto"><table id="quests"></table></div>
      </div>
    </div>

    <div class="panel" style="margin-bottom:10px">
      <h2 class="fold" data-card="console"><span class="chev">▼</span>console
        <span class="muted">(severity filter above)</span>
        <label class="muted" style="margin-left:auto; font-size:11px; display:flex; align-items:center; gap:4px; cursor:pointer"
               onclick="event.stopPropagation()"><input type="checkbox" id="noscroll"> stop autoscroll</label>
      </h2>
      <div class="body">
      <div id="log"></div>
      <details id="deathsbox" style="margin-top:8px">
        <summary style="cursor:pointer; color:var(--dim)">recent deaths <span id="dcount"></span></summary>
        <div id="deaths"></div>
      </details>
      </div>
    </div>

    <div class="panel">
      <h2 class="fold" data-card="metrics"><span class="chev">▼</span>metrics <span class="muted" id="mwin"></span></h2>
      <div class="body"><div style="max-height:340px; overflow:auto"><table id="metrics"></table></div></div>
    </div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const api = (p, q={}, method='GET') => {
  // The picker is populated asynchronously, so the first tick can fire before any bot is selected.
  // Return a not-ok response rather than requesting /api/bots//metrics, which 404s and paints an error
  // over a page that is merely still starting up.
  const who = $('#bot').value;
  if (!who) return Promise.resolve({ ok:false, status:0, json:async()=>({}), text:async()=>'' });
  const u = new URL(`/api/bots/${encodeURIComponent(who)}${p}`, location.origin);
  for (const [k,v] of Object.entries(q || {})) if (v !== undefined && v !== null && v !== '') u.searchParams.set(k,v);
  const tok = $('#tok').value.trim();
  return fetch(u, { method, headers: tok ? { Authorization:'Bearer '+tok } : {} });
};
const num = v => v === null || v === undefined ? '—'
  : (typeof v === 'number' ? (Number.isInteger(v) ? v : v.toFixed(2)) : v);

// ── live + metrics ────────────────────────────────────────────────────────────────────────────────
function vitals(l) {
  const pct = (a,b) => (a!=null && b) ? Math.max(0, Math.min(100, 100*a/b)) : 0;
  const bar = (a,b,col) => `<div class="bar"><i style="width:${pct(a,b)}%;background:${col}"></i></div>`;
  const dps = l.incomingDps5s, heal = l.sustainableHealDps;
  const losing = (dps>0 && heal>0 && dps>heal);
  return `
    <div class="kv">
      <div>phase</div><div>${l.phase ?? '—'}</div>
      <div>map</div><div>${l.mapDisplay ? `${l.mapDisplay} <span class="muted">(${l.map})</span>` : (l.map ?? '—')} <span class="muted">${l.position ?? ''}</span></div>
      <div>level</div><div>${num(l.level)} <span class="muted">exp ${num(l.exp)}</span></div>
      <div>money</div><div>${num(l.money)}</div>
    </div>
    <div style="margin-top:8px">hp ${num(l.hp)}/${num(l.maxHp)}${bar(l.hp,l.maxHp,'var(--ok)')}
    sp ${num(l.sp)}/${num(l.maxSp)}${bar(l.sp,l.maxSp,'var(--accent)')}</div>
    <div class="kv">
      <div>stones</div><div>hp ${num(l.hpStones)} · sp ${num(l.spStones)}</div>
      <div>bag</div><div>${num(l.bagUsed)} used · ${num(l.bagFree)} free <span class="muted">/ ${num(l.bagCapacity)} (inferred)</span>${l.bagFullServerSignal ? ' <span class="hit-warn">last pickup FAILED (0x346)</span>' : ''}</div>
      <div>combat</div><div>${l.inCombat ? 'YES' : 'no'} · aggro ${num(l.aggressors)}${l.nearestAggressorDist!=null?` @${num(l.nearestAggressorDist)}u`:''}</div>
      <div>mounted</div><div>${l.mounted ? 'yes' : 'no'}${l.dead ? ' · <span class="err">DEAD</span>' : ''}</div>
      <div>incoming</div><div class="${losing?'hit-crit':''}">${num(dps)} dmg/s</div>
      <div>heal cap</div><div>${heal!=null?num(heal)+' hp/s':'<span class="muted">unknown</span>'}</div>
    </div>
    ${losing ? '<div class="hit-crit" style="margin-top:6px">incoming exceeds sustainable healing — this fight cannot be out-healed</div>' : ''}
    <div class="muted" style="margin-top:6px">${l.script ?? ''}</div>`;
}

// ── combat map ────────────────────────────────────────────────────────────────────────────────────
// Zoomed right in, self always dead centre. Each mob is a circle carrying a NUMBER; the legend below
// maps number → name, so the map stays readable when a dozen of the same mob are on screen.
// Rings, outermost first:
//   • gold  = an objective of a currently ACTIVE quest (kill OR collect)
//   • red   = DANGEROUS, learned from the wire: the biggest hit this mob type has actually landed on us
//             is a large share of our max HP. A mob that has never hit us is UNKNOWN, not safe, and gets
//             no ring rather than a reassuring one.
//   • fill  = solid when it is currently aggro'd onto us, hollow otherwise.
// Zoom is SELECTABLE (operator 2026-08-11). CM_RANGE = units from centre to edge.
// ⚠️ Clustering must scale WITH the zoom or the map lies in both directions: CLUSTER_PX is a
// SCREEN-space radius, so at 8000u it would merge mobs that are hundreds of units apart into one
// blob, and at 150u it would split a single pack standing on one spot. The merge distance is
// therefore defined in WORLD units and converted to pixels per frame, so "what counts as one pack"
// means the same thing at every zoom level.
let CM_RANGE = 900;
const CLUSTER_WORLD_U = 70;   // mobs within this many world units read as one pack, at any zoom
function drawCombat(ent, maxHp) {
  const c = $('#combat'), g = c.getContext('2d');
  const W = c.width, H = c.height, cx = W/2, cy = H/2;
  g.clearRect(0,0,W,H); g.fillStyle = '#0b0e13'; g.fillRect(0,0,W,H);
  $('#cmscale').textContent = `±${CM_RANGE}u`;
  const pxPerU = (W/2-6)/CM_RANGE;
  if (!ent || !ent.self) { $('#legend').innerHTML = '<span class="muted">no position yet</span>'; return; }

  // range rings so distances are readable at a glance
  g.strokeStyle = '#1b2430';
  for (const r of [0.33, 0.66, 1]) { g.beginPath(); g.arc(cx, cy, r*(W/2-6), 0, Math.PI*2); g.stroke(); }

  const sx = ent.self.x, sy = ent.self.y;
  const toPx = (x,y) => [cx + ((x-sx)/CM_RANGE)*(W/2-6), cy + ((y-sy)/CM_RANGE)*(H/2-6)];

  // number the DISTINCT mob types present, so the legend is short
  const types = []; const numOf = new Map();
  for (const m of ent.mobs||[]) if (!numOf.has(m.mobId)) { numOf.set(m.mobId, types.length+1); types.push(m); }

  // CLUSTER overlapping mobs (operator P0): packs stand on top of each other and a circle per mob was an
  // unreadable smear. Group anything within CLUSTER_PX and draw ONE circle listing "count x legendNumber"
  // per type inside it. Radius grows with the population so a big pack reads as big.
  const CLUSTER_PX = Math.max(6, CLUSTER_WORLD_U * pxPerU);   // world-space merge, expressed in px
  const clusters = [];
  for (const m of ent.mobs||[]) {
    const [px,py] = toPx(m.x, m.y);
    if (px < -20 || py < -20 || px > W+20 || py > H+20) continue;   // outside the zoom window
    let c = clusters.find(k => Math.hypot(k.x-px, k.y-py) <= CLUSTER_PX);
    if (!c) { c = { x:px, y:py, n:0, types:new Map(), aggro:false, quest:false, danger:false }; clusters.push(c); }
    // Keep the circle centred on the pack, not on whichever mob happened to be first.
    c.x = (c.x*c.n + px)/(c.n+1); c.y = (c.y*c.n + py)/(c.n+1); c.n++;
    const key = numOf.get(m.mobId);
    c.types.set(key, (c.types.get(key)||0) + 1);
    if (m.aggro) c.aggro = true;
    if (m.questMob) c.quest = true;
    if (maxHp > 0 && m.maxHitSeen > 0 && m.maxHitSeen >= maxHp*0.15) c.danger = true;
  }
  g.textAlign = 'center'; g.textBaseline = 'middle';
  for (const c of clusters) {
    const lines = [...c.types.entries()].sort((a,b) => a[0]-b[0]).map(([k,n]) => `${n}x ${k}`);
    const r = Math.max(9, Math.min(30, 8 + 4*lines.length + 1.4*c.n));
    g.beginPath(); g.arc(c.x, c.y, r, 0, Math.PI*2);
    g.fillStyle = c.aggro ? 'rgba(248,81,73,.55)' : 'rgba(125,133,144,.22)';
    g.fill();
    if (c.danger) { g.strokeStyle = '#f85149'; g.lineWidth = 2; g.stroke(); }
    if (c.quest)  { g.beginPath(); g.arc(c.x, c.y, r+3, 0, Math.PI*2); g.strokeStyle = '#d4a017'; g.lineWidth = 2; g.stroke(); }
    g.fillStyle = '#e6edf3'; g.font = '10px ui-monospace,monospace';
    const lh = 10, top = c.y - ((lines.length-1)*lh)/2;
    lines.forEach((t,i) => g.fillText(t, c.x, top + i*lh));
  }
  for (const p of ent.party||[]) {
    if (!p.x && !p.y) continue;         // MEMBERLOCATION layout not pinned → 0,0 means UNKNOWN, don't draw
    const [px,py] = toPx(p.x, p.y);
    g.beginPath(); g.arc(px, py, 7, 0, Math.PI*2); g.fillStyle = 'rgba(88,166,255,.7)'; g.fill();
  }
  // ── FACING ARROW + TARGET RAY ────────────────────────────────────────────────────────────────
  // Operator 2026-08-11: show which way the bot is POINTED. Drawn together with a dashed ray to the
  // current target, because the pair is what actually diagnoses the open combat bug — if we overshoot
  // a mob (or meet its stand-off circle on the wrong side) the target ends up BEHIND us, which fails
  // casts and produces swing-less bashes at the same time. Two rays make that instant; numbers hide it.
  // Facing null = never set. Draw NOTHING then — a default 0° would be a confident arrow pointing east.
  if (ent.self.facing != null) {
    // ⚠️ USE THE SAME y CONVENTION AS toPx, WHICH DOES NOT FLIP (it plots cy + (y-sy)*scale, so world
    // +y is drawn DOWNWARD). The first version negated sin here "because screen y grows downward" and
    // the arrow came out mirrored against the very mobs it shares a canvas with (operator caught it).
    // Whether the world's y points north is irrelevant to this canvas -- what matters is that the arrow
    // and the mob dots agree, or the picture is worse than no picture.
    const a = ent.self.facing * Math.PI/180, L = 26;
    const ex = cx + Math.cos(a)*L, ey = cy + Math.sin(a)*L;
    g.strokeStyle = '#3fb950'; g.lineWidth = 2;
    g.beginPath(); g.moveTo(cx, cy); g.lineTo(ex, ey); g.stroke();
    g.beginPath();                                  // arrow head, same convention as the shaft
    g.moveTo(ex, ey);
    g.lineTo(ex - Math.cos(a-0.4)*7, ey - Math.sin(a-0.4)*7);
    g.lineTo(ex - Math.cos(a+0.4)*7, ey - Math.sin(a+0.4)*7);
    g.closePath(); g.fillStyle = '#3fb950'; g.fill();
  }
  // Target ray: only when the target handle matches something actually in view (see the endpoint note
  // on why 0 is not overloaded as "no target").
  const tgt = (ent.mobs||[]).find(m => m.handle === ent.self.target);
  if (tgt) {
    const [tx,ty] = toPx(tgt.x, tgt.y);
    g.save(); g.setLineDash([3,3]);
    g.strokeStyle = '#d4a017'; g.lineWidth = 1.5;
    g.beginPath(); g.moveTo(cx, cy); g.lineTo(tx, ty); g.stroke();
    g.restore();
  }
  // ── CURRENT TARGET, in words (operator 2026-08-12) ──────────────────────────────────────────
  // You can only auto-attack or cast at the entity the SERVER currently has selected, so "what are we
  // targeting" is a first-class combat fact — and it was only ever visible by reading packet logs.
  // Shows the raw handle even when the entity is NOT in view: "targeting a handle we cannot see" is
  // itself the diagnosis (the JCQ clone is a scripted player-copy that never enters the mob list).
  {
    const tc = $('#tgtcell');
    if (tc) {
      const h = ent.self.target;
      if (h == null) tc.innerHTML = '<span class="muted">none</span>';
      else if (tgt) {
        const d = Math.hypot(tgt.x - sx, tgt.y - sy);
        tc.innerHTML = `<b>h${h}</b> ${tgt.name || ('mob' + tgt.mobId)} `
          + `<span class="muted">(m${tgt.mobId}${tgt.level ? ' L' + tgt.level : ''}) ${d.toFixed(0)}u`
          + `${tgt.hp != null ? ' hp' + tgt.hp : ''}${tgt.aggro ? ' AGGRO' : ''}</span>`;
      } else {
        tc.innerHTML = `<b>h${h}</b> <span style="color:#f85149">NOT IN VIEW</span> `
          + `<span class="muted">— selected but absent from the entity list; cannot be drawn, `
          + `and a cast/bash aimed elsewhere will not hit it</span>`;
      }
    }
  }
  // self last, on top
  g.beginPath(); g.arc(cx, cy, 5, 0, Math.PI*2); g.fillStyle = '#3fb950'; g.fill();

  $('#legend').innerHTML = types.length
    ? types.map(m => `<span><b>${numOf.get(m.mobId)}</b> ${m.name} <span class="muted">(m${m.mobId}${m.level?` L${m.level}`:''})</span></span>`).join('')
      + '<span class="muted">· gold ring = quest mob · red ring = has hit us hard · solid = aggro'
        + ' · green arrow = our facing · dashed gold = to current target</span>'
    : '<span class="muted">nothing in view</span>';
}

// Skill TILES, like an MMO action bar. A skill with no cooldown length in client data gets a DASHED
// border, never a lit one — unknown must stay unknown, or the panel lies about what the bot can do.
// MISC = not a combat skill: Korean-named entries (the client ships a pile of them), plus gathering and
// mount skills. Hidden by default so the bar shows what the bot actually fights with. This is a DISPLAY
// filter on names — it changes nothing the bot does.
const HANGUL = /[ᄀ-ᇿ㄰-㆏ꥠ-꥿가-힯]/;
const MISC_RX = /(mining|gather|ride|mover|fishing|cooking|craft)/i;
// Server-side DATA flag first (ActiveSkill.DemandType==2 = gathering/mount/event toy). The name tests
// stay only as a fallback for builds without the flag — a blocklist of names kept leaking new toys
// (Mining, Ride Mover, Water Cannon, Cake/Soda summons all slipped through).
const isMisc = s => s.misc === true || (s.misc === undefined && (() => { const n = s.name || ''; return !n || HANGUL.test(n) || MISC_RX.test(n); })());
// Skills come as "Name [01]", "Name [02]" — the same skill at successive ranks. Default to the HIGHEST
// rank only, since the lower ones are superseded and just crowd the bar.
const baseName = n => (n || '').replace(/\s*\[\d+\]\s*$/, '').trim();
const rankOf  = n => { const m = /\[(\d+)\]\s*$/.exec(n || ''); return m ? Number(m[1]) : 0; };
function filterSkills(list) {
  let out = list;
  if (!$('#skmisc').checked)   out = out.filter(x => !isMisc(x));
  if (!$('#sklevels').checked) {
    const best = new Map();
    for (const x of out) {
      const b = baseName(x.name) || String(x.id);
      const cur = best.get(b);
      if (!cur || rankOf(x.name) > rankOf(cur.name)) best.set(b, x);
    }
    out = [...best.values()];
  }
  return out;
}

function skillTiles(all) {
  if (!all || !all.length) { $('#skills').innerHTML = '<span class="muted">no skills</span>'; return; }
  const list = filterSkills(all);
  const hidden = all.length - list.length;
  $('#skhint').textContent = `· ${list.length} shown${hidden ? ` (${hidden} filtered)` : ''} · lit = ready, dashed = cd unknown`;
  $('#skills').innerHTML = list.map(s => {
    const cd = s.cooldownMs || 0, rem = s.remainingMs;
    if (!cd) return `<div class="tile unk" title="${s.name||s.id} — DelayTime unknown in client data">
                       <span class="nm">${s.name || s.id}</span></div>`;
    const cooling = rem != null && rem > 0;
    // Sweep covers the fraction of the cooldown STILL TO RUN, so the tile visibly empties as it comes up.
    const frac = cooling ? Math.max(0, Math.min(1, rem / cd)) : 0;
    const sweep = cooling
      ? `<div class="sweep" style="background:conic-gradient(rgba(0,0,0,.72) ${frac*360}deg, rgba(0,0,0,0) 0)"></div>` : '';
    return `<div class="tile ${cooling?'cool':'ready'}" title="${s.name||s.id} · cd ${(cd/1000).toFixed(1)}s · sp ${s.spCost??'?'}">
              ${sweep}<span class="nm">${s.name || s.id}</span>
              ${cooling ? `<span class="cd">${(rem/1000).toFixed(1)}</span>` : ''}</div>`;
  }).join('');
}

// Character sheet: fixed stats + passives, together, per the layout spec. Every value here is either
// from the wire (CHAR_PARAMETER_DATA at zone-entry) or client data — nothing derived or guessed, and a
// missing block renders as "not known" rather than zeros.
function charSheet(l) {
  const st = l.stats;
  const stats = !st ? '<div class="muted">stats not known (no CHAR_PARAMETER_DATA this login)</div>' : `
    <div class="kv">
      <div>STR / END</div><div>${num(st.str)} / ${num(st.end)}${l.freeStatPoints ? ` <span class="hit-warn">+${l.freeStatPoints} unspent</span>` : ''}</div>
      <div>DEX / INT / SPR</div><div>${num(st.dex)} / ${num(st.int)} / ${num(st.spr)}</div>
      <div>attack</div><div>${num(st.dmgMin)}~${num(st.dmgMax)} <span class="muted">m.dmg ${num(st.magicDmg)}</span></div>
      <div>defence</div><div>DEF ${num(st.def)} · M.DEF ${num(st.magicDef)}</div>
      <div>aim / evasion</div><div>${num(st.aim)} / ${num(st.evasion)}</div>
      <div>facing</div><div>${l.facing != null ? l.facing.toFixed(0)+'°' : '<span class="muted">none set</span>'}</div>
      <div>target</div><div id="tgtcell"><span class="muted">—</span></div>
      <div>level exp</div><div>${expBandText(l)}</div>
    </div>`;
  const ps = l.passives;
  const passives = !ps || !ps.length ? '<div class="muted">none</div>'
    : ps.map(p => `<div>${p.name || ('passive '+p.id)}</div>`).join('');
  return `${stats}<h2 style="margin-top:10px">passives</h2>${passives}`;
}

function metricsTable(ms) {
  // Percentiles follow each metric's direction: for HigherIsBetter the LOW tail is the warning sign,
  // for LowerIsBetter the HIGH tail is. The server already picks the right end; we just label it.
  const wins = ms[0]?.windows?.map(w => w.window) ?? [];
  $('#mwin').textContent = wins.length ? `· windows ${wins.join(' / ')} · p95/p99 = worst-case tail for that metric` : '';
  let h = '<tr><th>metric</th><th>now</th>';
  for (const w of wins) h += `<th>${w} avg</th><th>${w} p95</th><th>${w} sum</th>`;
  h += '</tr>';
  for (const m of ms) {
    h += `<tr><td title="${m.direction} · ${m.kind}">${m.name}</td><td>${num(m.latest)}</td>`;
    for (const w of m.windows) h += `<td>${num(w.avg)}</td><td>${num(w.p95)}</td><td>${num(w.sum)}</td>`;
    h += '</tr>';
  }
  return h;
}

async function tickMetrics() {
  try {
    const r = await api('/metrics');
    if (!r.ok) { $('#status').textContent = `metrics ${r.status}`; return; }
    const d = await r.json();
    $('#vitals').innerHTML = vitals(d.live);
    $('#charsheet').innerHTML = charSheet(d.live);
    skillTiles(d.live.skills);
    lastLive = d.live;
    questList = d.live.quests || [];
    questsById = new Map(questList.map(q => [q.name, q]));
    focusLine(d.live.focus);
    questTable(questList);
    $('#metrics').innerHTML = metricsTable(d.metrics);
    const sel = $('#mapsel');
    const have = new Set([...sel.options].map(o=>o.value));
    for (const k of Object.keys(d.maps||{})) if (!have.has(k)) sel.add(new Option(k,k));
    // Name the map being DRAWN first — the legend used to list every map's counts with no indication of
    // which one the canvas showed, which read as "it is drawing all of these at once" (it was).
    const drawn = selectedMap();
    const drawnName = d.live.mapDisplay && drawn === d.live.map ? `${d.live.mapDisplay} (${drawn})` : (drawn || '—');
    const others = Object.entries(d.maps||{}).filter(([k]) => k !== drawn)
      .map(([k,v])=>`${k}:${v}`).join('  ');
    $('#mapinfo').innerHTML = `showing <b>${drawnName}</b>: ${(d.maps||{})[drawn] ?? 0} pts` +
      (others ? ` <span class="muted">· other maps (not drawn): ${others}</span>` : '');
    $('#status').textContent = 'ok ' + new Date().toLocaleTimeString();
  } catch (e) { $('#status').textContent = 'metrics: ' + e.message; }
}

// ── heatmap (rendered client-side from raw points, per the epic) ──────────────────────────────────
// ⭐ "(current)" MEANS THE CURRENT MAP — it used to mean NO FILTER, which overlaid every map the bot has
// ever walked into one canvas: the bounding box spanned all of them at once, so the shapes sat on top of
// each other and the legend counted four maps ("EldCem01:45 Eld:61 RouCos03:84 RouVal02:48") while the
// option said "(current)". Resolve it to the map the bot is standing on (lastLive.map) so the default
// view is one map, and follow the bot when it changes map.
function selectedMap() {
  const v = $('#mapsel').value;
  return v || (lastLive && lastLive.map) || null;
}
let pts = [], sinceT = 0, lastMap = null;
async function tickTrace() {
  try {
    const map = selectedMap() || undefined;
    if (map !== lastMap) { pts = []; sinceT = 0; lastMap = map; }   // map switch = fresh canvas
    const r = await api('/trace', { since: sinceT, map, recent: $('#recent').checked });
    if (!r.ok) return;
    const d = await r.json();
    for (const p of d.points) { pts.push(p); if (p.t > sinceT) sinceT = p.t; }
    if (pts.length > 20000) pts = pts.slice(-20000);
    draw(d.nowUnixMs);
  } catch {}
}

function draw(now) {
  const c = $('#heat'), g = c.getContext('2d');
  const W = c.width, H = c.height;
  g.clearRect(0,0,W,H);
  // Always filter to ONE map. Mixing maps in a single bounding box is not a heatmap, it is a collage.
  const mapKey = selectedMap();
  const shown = mapKey ? pts.filter(p=>p.map===mapKey) : pts;
  if (!shown.length) { g.fillStyle='#30363d'; g.fillText('no trace yet', 10, 20); return; }
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for (const p of shown) { if(p.x<x0)x0=p.x; if(p.x>x1)x1=p.x; if(p.y<y0)y0=p.y; if(p.y>y1)y1=p.y; }
  const pad = 8, sx = (x1-x0)||1, sy = (y1-y0)||1, s = Math.min((W-2*pad)/sx, (H-2*pad)/sy);
  const px = p => pad + (p.x-x0)*s, py = p => H - (pad + (p.y-y0)*s);   // flip Y: game +Y is up
  // Age-based decay is applied HERE, in the browser, so the server never has to pick a curve and the
  // same raw points can be re-rendered with different decay without refetching.
  const span = 30*60*1000;
  for (const p of shown) {
    const age = Math.min(1, (now - p.t) / span);
    g.fillStyle = `rgba(${Math.round(88+167*(1-age))},${Math.round(166-60*age)},${Math.round(255-140*age)},${0.15+0.55*(1-age)})`;
    g.fillRect(px(p)-1.5, py(p)-1.5, 3, 3);
  }
  const last = shown[shown.length-1];
  g.fillStyle = '#f85149'; g.beginPath(); g.arc(px(last), py(last), 3.5, 0, 7); g.fill();
  g.fillStyle = '#7d8590';
  g.fillText(`${shown.length} pts  x ${x0}-${x1}  y ${y0}-${y1}`, 6, H-6);
}

// ── log with severity filter ──────────────────────────────────────────────────────────────────────
async function tickLog() {
  try {
    const r = await api('/log', { level: $('#lvl').value, max: 400 });
    if (!r.ok) return;
    const txt = await r.text();
    const el = $('#log');
    const atBottom = el.scrollTop + el.clientHeight >= el.scrollHeight - 30;
    el.innerHTML = txt.trimEnd().split('\n').map(line => {
      let cls = 'l-verb';
      if (/ N /.test(line.slice(12,16))) cls = 'l-note';
      else if (/ I /.test(line.slice(12,16))) cls = 'l-info';
      let h = line.replace(/[&<>]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[ch]));
      h = h.replace(/CRUTCH\[CRIT\]/g,'<span class="hit-crit">CRUTCH[CRIT]</span>')
           .replace(/CRUTCH\[WARN\]/g,'<span class="hit-warn">CRUTCH[WARN]</span>')
           .replace(/CRUTCH\[OK\]/g,'<span class="hit-ok">CRUTCH[OK]</span>')
           .replace(/\bDIED\b|\bDEATH\b/g,'<span class="hit-crit">$&</span>');
      return `<div class="${cls}">${h}</div>`;
    }).join('');
    // Hold position when the operator is reading back through the log. The checkbox sits in the card
    // header, so its click must not also toggle the fold — hence stopPropagation on the label.
    if (atBottom && !$('#noscroll').checked) el.scrollTop = el.scrollHeight;
    scanEvents(txt);
  } catch {}
}

$('#mapsel').onchange = () => { pts=[]; sinceT=0; };
$('#recent').onchange = () => { pts=[]; sinceT=0; };
const saved = localStorage.getItem('botwatch.tok'); if (saved) $('#tok').value = saved;
$('#tok').onchange = () => localStorage.setItem('botwatch.tok', $('#tok').value);

// ── bot picker ────────────────────────────────────────────────────────────────────────────────────
// Populated from GET /api/bots and refreshed, so a bot spawned (or lost) while the page is open shows up
// without a reload. The chosen bot persists in localStorage — reopening the page returns to the one you
// were watching rather than whichever id happens to sort first.
// Rebuild only when the SET of bots changes: replacing the options every poll would slam an open
// dropdown shut while the operator is choosing from it.
let botListKey = '';
async function tickBots() {
  try {
    const u = new URL('/api/bots', location.origin);
    const tok = $('#tok').value.trim();
    const r = await fetch(u, { headers: tok ? { Authorization:'Bearer '+tok } : {} });
    if (!r.ok) return;
    const bots = await r.json();
    // Label with the state that decides whether the panels will have anything in them, so a bot that
    // died or never entered a zone is obvious IN THE PICKER instead of looking like empty panels.
    // The selected bot is part of the key: while it is away the list itself may not change, but the
    // "— reconnecting…" entry has to be rebuilt (and removed again on its return), so the early-out
    // must notice that too.
    const key = bots.map(b => `${b.id}:${b.phase}:${b.level ?? ''}`).join('|') + '#' + ($('#bot').value || '');
    if (key === botListKey) return;
    botListKey = key;
    const sel = $('#bot');
    const want = sel.value || localStorage.getItem('botwatch.bot') || (bots[0] && bots[0].id) || '';
    let html = bots.map(b => {
      const lvl = b.level ? ` L${b.level}` : '';
      const bad = b.phase !== 'InZone' ? ` — ${b.phase}` : '';
      return `<option value="${b.id}"${b.id === want ? ' selected' : ''}>${b.id}${lvl}${bad}</option>`;
    }).join('');
    // ⛔ DO NOT SWITCH BOTS BEHIND THE OPERATOR'S BACK. This used to fall back to bots[0] whenever the
    // selected bot was missing from the list — and a bot goes missing for a few seconds on every RELOG
    // and every cross-server zone change, because StopAsync removes the handle before Spawn re-adds it
    // (the 404 window tracked as a P0). So watching a bot through a map change silently moved you to a
    // different bot, and it never moved back: next refresh `want` read the NEW selection as the wanted
    // one. Operator 2026-08-11: "the UI sometimes randomly swaps which bot is being watched (maybe on
    // zone change?)" — exactly that.
    // Keep the chosen bot selected and say it is reconnecting. Only a real click changes bots.
    if (want && !bots.some(b => b.id === want))
      html += `<option value="${want}" selected>${want} — reconnecting…</option>`;
    sel.innerHTML = html;
    sel.value = want;
  } catch {}
}
$('#bot').onchange = () => {
  localStorage.setItem('botwatch.bot', $('#bot').value);
  // Everything on the page belongs to ONE bot. Switching without clearing leaves the previous bot's
  // trace, quests and toasts on screen under the new bot's name — which is worse than a blank panel.
  pts = []; sinceT = 0; lastMap = null; lastLive = null; questList = []; questsById = new Map();
  tickMetrics(); tickTrace(); tickLog(); tickCombat();
};
setInterval(tickBots, 5000); tickBots();

setInterval(tickMetrics, 2000); tickMetrics();
setInterval(tickTrace, 1000);   tickTrace();
setInterval(tickLog, 2000);     tickLog();

// Deaths are fetched SEPARATELY: at level=note with a wide window, because the console runs a rolling
// 400-line window at the user's chosen level and a single death report is far bigger than that. Low
// cadence — deaths are rare and this asks for a lot of history.
async function tickDeaths() {
  try {
    const r = await api('/log', { level: 'note', max: 100000 });
    if (!r.ok) return;
    renderDeaths(await r.text());
  } catch {}
}
setInterval(tickDeaths, 20000);  tickDeaths();

// ── card folding (persisted) ──────────────────────────────────────────────────────────────────────
// Default OPEN; only an explicit collapse is remembered, so a new card added later shows up rather
// than being hidden by a stale preference.
function applyFold(h) {
  const card = h.dataset.card, panel = h.closest('.panel');
  if (localStorage.getItem('fold:' + card) === 'closed') panel.classList.add('closed');
  h.onclick = () => {
    const closed = panel.classList.toggle('closed');
    localStorage.setItem('fold:' + card, closed ? 'closed' : 'open');
  };
}
document.querySelectorAll('h2.fold').forEach(applyFold);

// ── token + bot id persistence ────────────────────────────────────────────────────────────────────
// The bearer token is kept in localStorage so a reload doesn't mean re-pasting it. It is a
// browser-local convenience on an already-authenticated view, not a new place secrets travel.
for (const [el, key] of [[$('#tok'), 'watch:tok'], [$('#bot'), 'watch:bot']]) {
  const saved = localStorage.getItem(key);
  if (saved) el.value = saved;
  el.addEventListener('change', () => localStorage.setItem(key, el.value));
  el.addEventListener('blur',   () => localStorage.setItem(key, el.value));
}
if (localStorage.getItem('watch:noscroll') === '1') $('#noscroll').checked = true;
$('#noscroll').addEventListener('change', e => localStorage.setItem('watch:noscroll', e.target.checked ? '1' : '0'));
$('#skmisc').addEventListener('change', () => lastLive && skillTiles(lastLive.skills));
$('#sklevels').addEventListener('change', () => lastLive && skillTiles(lastLive.skills));
// Combat-map zoom: persisted like the other view settings, and applied to CM_RANGE. Redraw is left to
// the 5/sec tick rather than forced here — one frame of latency is imperceptible and it keeps a single
// draw path, so the selector cannot drift from what the tick renders.
{
  const z = $('#cmzoom'), saved = localStorage.getItem('watch:cmzoom');
  if (saved) z.value = saved;
  CM_RANGE = Number(z.value);
  z.addEventListener('change', () => { CM_RANGE = Number(z.value); localStorage.setItem('watch:cmzoom', z.value); });
}

// ── combat map at 5/sec ───────────────────────────────────────────────────────────────────────────
// Its own cheap endpoint: mob positions change constantly, and /metrics (whole metric snapshot +
// quest board + trace counts) is far too heavy to poll at this rate.
async function tickCombat() {
  try {
    const r = await api('/entities');
    if (!r.ok) return;
    const d = await r.json();
    $('#mapname').textContent = d.mapDisplay ? `· ${d.mapDisplay} (${d.map})` : (d.map ? `· ${d.map}` : '');
    drawCombat(d.entities, d.maxHp);
  } catch {}
}
setInterval(tickCombat, 200);   tickCombat();

// ── quest board ───────────────────────────────────────────────────────────────────────────────────
// Progress is the SERVER's credited count, not our kill tally — a mob dying credits nothing if the
// quest isn't tracking it. A quest missing from client data is shown with `?` rather than hidden,
// because a silent omission would conceal exactly the QuestData decode gaps worth seeing.
// EXP with a thousands separator, as the client shows it: 12345 -> "12.345 EXP".
const expStr = n => !n ? '—' : `${Number(n).toLocaleString('de-DE')} EXP`;

// The DRIVER's own answer to "what are you doing and why" (bot.setFocus -> live.focus). The board's
// order only MIRRORS the driver's sort, so it can look plausible while the driver is on something else
// entirely; this is the one authoritative statement of the current target.
function focusLine(f) {
  if (!f) { $('#focus').innerHTML = '<span class="muted">driver has not reported an intent yet</span>'; return; }
  const stale = f.ageMs > 15000 ? ` <span class="hit-warn">(last said ${Math.round(f.ageMs/1000)}s ago)</span>` : '';
  const q = f.questName ? ` for <b>${f.questName}</b>` : '';
  const dest = f.destination ? ` &rarr; <b>${f.destination}</b>` : '';
  const why = f.reason ? ` <span class="muted">· ${f.reason}</span>` : '';
  $('#focus').innerHTML = `<b>${f.phase || '?'}</b>${dest}${q}${why}${stale}`;
}

// Operator override: clear a quest's flee-deprioritization. The mark's only automatic expiry is a
// level-up, and every mark is written at the level we fled at — so a handful of marks at the current
// level takes the whole board dark and the bot grinds instead of levelling, which is the slowest route
// to the level that would clear them. A human can see a mark is stale; this is how they say so.
// Operator recovery: clean logout → re-login in place, re-applying the same script. Same thing the
// driver's HARD-WEDGE watchdog does automatically after 150s of frozen position AND exp; this is the
// manual handle for when a human can see it is stuck before the watchdog does.
// Confirm first — a relog costs the ring buffer (new handle, new buffer) and ~30s of play.
async function relogBot() {
  const id = $('#bot').value;
  if (!id) return;
  if (!confirm(`Relog ${id}?\n\nClean logout → re-login → re-apply the script.\n`
             + `Its log buffer will restart EMPTY and it 404s for a few seconds mid-relog.`)) return;
  try {
    const r = await api('/relog', null, 'POST');
    if (!r.ok) { toast('goal', [id, 'relog FAILED', `HTTP ${r.status}`]); return; }
    toast('hand', [id, 'RELOG requested', 'logout → login → re-apply script']);
  } catch (e) { toast('goal', [id, 'relog FAILED', e.message]); }
}

async function undeprio(qid, name) {
  try {
    const r = await api(`/quest/${qid}/undeprioritize`, null, 'POST');
    if (!r.ok) { toast('goal', [name, 'un-deprio FAILED', `HTTP ${r.status}`]); return; }
    const d = await r.json();
    toast('hand', [name, d.clearedMark ? 'Un-deprioritized' : 'had no mark',
                   d.clearedDeathsAtLevel ? `cleared ${d.clearedDeathsAtLevel} death(s) @lvl${d.level}` : `lvl${d.level}`]);
    tickMetrics();
  } catch (e) { toast('goal', [name, 'un-deprio FAILED', e.message]); }
}

function questTable(qs) {
  if (!qs || !qs.length) { $('#quests').innerHTML = ''; $('#qhint').textContent = '· none accepted'; return; }
  const ready = qs.filter(q => q.ready).length;
  const focusId = (lastLive && lastLive.focus && lastLive.focus.questId) || 0;
  // Order MIRRORS the driver's documented sort (ready > no-objection > LOCAL > closer-to-done > exp).
  // It is not the driver's own queue — that lives in the Lua — so it reads as "roughly what's next".
  $('#qhint').textContent = `· ${qs.length} accepted${ready ? ` · ${ready} READY` : ''} · order mirrors the driver's sort`;
  // Goal progress shares the reward column: a goal row's X/Y sits under its quest's exp, so the numbers
  // line up in one narrow column instead of each claiming its own.
  let h = '<colgroup><col class="c-name"><col class="c-num"><col class="c-stat"><col class="c-here"></colgroup>';
  for (const q of qs) {
    const status = q.ready ? '<span class="hit-ok">READY</span>'
                 : q.reason ? `<span class="hit-warn" title="${(q.reasonDetail||q.reason).replace(/"/g,"")}">${q.reason}</span>`
                 : '<span class="muted">working</span>';
    // ★ = the quest the DRIVER says it is on, not the one this table happens to sort first.
    const isFocus = focusId && q.id === focusId;
    // The un-deprio button belongs only on a quest that actually carries a mark; showing it everywhere
    // would invite clicks that do nothing and read as a broken button.
    const undep = q.reason === 'deaths'
      ? ` <button class="mini" onclick="undeprio(${q.id}, '${(q.name||'').replace(/'/g,"\\'")}')" title="Clear the flee-deprioritization and the per-level death count, so the driver re-evaluates this quest now">un-deprio</button>`
      : '';
    h += `<tr class="qh${isFocus ? ' qfocus' : ''}">
            <td>${isFocus ? '<span class="hit-ok" title="the driver says it is working this one">★</span> ' : ''}<b>${q.name}</b>${q.repeatable ? ' <span class="muted">(rep)</span>' : ''}${undep}</td>
            <td>${expStr(q.expReward)}</td>
            <td>${status}</td>
            <td>${q.onCurrentMap ? '<span class="hit-ok">here</span>' : '<span class="muted">—</span>'}</td>
          </tr>`;
    for (const g of (q.goals || [])) {
      const done = g.need > 0 && g.progress >= g.need;
      h += `<tr class="qg">
              <td>&nbsp;&nbsp;&nbsp;${g.kind} ${g.target} <span class="muted">${g.mobId ? `(m${g.mobId})` : (g.itemId ? `(i${g.itemId})` : '')}</span></td>
              <td class="${done ? 'hit-ok' : ''}">${g.progress}/${g.need || '?'}</td>
              <td></td>
              <td>${g.onCurrentMap ? '<span class="hit-ok">here</span>' : ''}</td>
            </tr>`;
    }
    if (!(q.goals || []).length)
      h += `<tr class="qg"><td colspan="4">&nbsp;&nbsp;&nbsp;<span class="muted">no objectives resolved</span></td></tr>`;
  }
  $('#quests').innerHTML = h;
}

// ── death reports (fold-out under the console) ────────────────────────────────────────────────────
// Grouped client-side out of the [death] lines the driver emits. Bounded by whatever is still in the
// log ring, so this is "recent deaths", not an archive — labelled as such rather than implying more.
let deathSeen = new Set();
function renderDeaths(txt) {
  const blocks = []; let cur = null;
  for (const line of txt.split('\n')) {
    const isDeath = line.includes('[death]');
    if (isDeath) {
      if (line.includes('[death] SELF:')) { if (cur) blocks.push(cur); cur = { t: line.slice(0,12), lines: [] }; }
      if (!cur) cur = { t: line.slice(0,12), lines: [] };
      cur.lines.push(line.replace(/^.*\[death\]\s?/, ''));
    }
  }
  if (cur) blocks.push(cur);
  $('#dcount').textContent = blocks.length ? `(${blocks.length} in buffer)` : '(none in buffer)';
  $('#deaths').innerHTML = blocks.reverse().map(b => {
    const head = (b.lines[0] || '').slice(0, 110);
    const esc = t => t.replace(/[&<>]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[ch]));
    return `<details><summary>${b.t} — ${esc(head)}</summary><pre>${esc(b.lines.join('\n'))}</pre></details>`;
  }).join('');
}

// ── toaster ───────────────────────────────────────────────────────────────────────────────────────
// Fired off the log stream, which is where these events are already reported. Each line is keyed by
// its timestamp+text so a re-poll of the same window doesn't re-toast it.
// ⚠️ The hand-in toast shows EXP but NO percentage. The operator asked for
// exp / (nextLevelExp - currLevelExp), and that denominator is NOT available: there is no
// level→exp table in ressystem and no "exp to next level" field anywhere in the PDB protocol
// structs (only EXPGAIN and CurrentExp). Showing a made-up % would be worse than showing none.
// Exp within the current LEVEL band: (exp - PrevExp) / (NextExp - PrevExp), both from
// CHAR_PARAMETER_DATA. This is the same pair the real client's exp bar is drawn from.
function expPct(l) {
  const st = l && l.stats; if (!st || !st.expBand) return null;
  const into = Number(l.exp) - Number(st.prevExp);
  if (!isFinite(into) || into < 0) return null;
  return 100 * into / Number(st.expBand);
}
function expBandText(l) {
  const st = l.stats, p = expPct(l);
  if (!st || !st.expBand) return '<span class="muted">band not known</span>';
  return `${Number(l.exp) - Number(st.prevExp)} / ${st.expBand} <span class="muted">(${p.toFixed(1)}%)</span>`;
}
const toastSeen = new Set();
function toast(kind, parts) {
  const el = document.createElement('div');
  el.className = 'toast ' + kind;
  el.innerHTML = parts.map((p,i) => i ? `<span class="sep">|</span>${p}` : `<span class="q">${p}</span>`).join('');
  $('#toasts').appendChild(el);
  setTimeout(() => { el.style.transition='opacity .4s'; el.style.opacity='0'; setTimeout(()=>el.remove(), 400); }, 6000);
}
function scanEvents(txt) {
  for (const line of txt.split('\n')) {
    if (toastSeen.has(line)) continue;
    // QUEST_MOB_KILL quest=<name> credited (total N)
    let m = line.match(/QUEST_MOB_KILL quest=(.+?) credited \(total (\d+)\)/);
    if (m) {
      toastSeen.add(line);
      const q = questsById.get(m[1]) || questsByName(m[1]);
      const need = q?.need || 0;
      toast('kill', [m[1], lastKilledName || 'enemy', need ? `${m[2]} / ${need}` : `${m[2]}`]);
      if (need && Number(m[2]) >= need) toast('goal', [m[1], 'Goals Reached']);
      continue;
    }
    m = line.match(/\[lq\] ENGAGE (.+?) h=/) || line.match(/\[combat\] KILLED (.+?) /);
    if (m) { lastKilledName = m[1]; }
    m = line.match(/(.+?) HANDED IN /);
    if (m && line.includes('CRUTCH')) {
      toastSeen.add(line);
      const nm = m[1].replace(/^.*CRUTCH\[OK\]\s*/, '');
      const q = questsByName(nm);
      // % of the CURRENT LEVEL this reward is worth — exp / (NextExp - PrevExp), as asked for.
      const band = lastLive?.stats?.expBand || 0;
      const pct = (q?.expReward && band) ? ` (${(100*q.expReward/Number(band)).toFixed(1)}%)` : '';
      toast('hand', [nm, 'Handed In', q?.expReward ? `${q.expReward} EXP${pct}` : 'reward granted']);
    }
  }
  if (toastSeen.size > 4000) toastSeen.clear();
}
let lastKilledName = null, lastLive = null;
let questsById = new Map(), questList = [];
function questsByName(n) { return questList.find(q => q.name === n); }
</script>
