<!doctype html>
<meta charset="utf-8">
<title>bot watch</title>
<style>
  :root { --bg:#0e1116; --panel:#161b22; --line:#232a34; --fg:#c9d1d9; --dim:#7d8590;
          --ok:#3fb950; --warn:#d29922; --crit:#f85149; --accent:#58a6ff; }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--fg); font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace }
  header { display:flex; gap:12px; align-items:center; padding:8px 12px; border-bottom:1px solid var(--line) }
  header input,header select { background:var(--panel); color:var(--fg); border:1px solid var(--line); padding:4px 6px; border-radius:4px; font:inherit }
  /* Constrain the page: on a wide monitor the panels stretched to unreadable line lengths. */
  .wrap { display:grid; grid-template-columns: 320px minmax(0,1fr); gap:10px; padding:10px;
          align-items:start; max-width:1400px; margin:0 auto }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:10px }
  h2 { margin:0 0 8px; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--dim) }
  .kv { display:grid; grid-template-columns:auto 1fr; gap:2px 10px }
  .kv div:nth-child(odd) { color:var(--dim) }
  .bar { height:6px; background:#0b0e13; border-radius:3px; overflow:hidden; margin:3px 0 7px }
  .bar > i { display:block; height:100%; background:var(--ok) }
  table { width:100%; border-collapse:collapse }
  th,td { text-align:right; padding:2px 5px; border-bottom:1px solid var(--line); white-space:nowrap }
  th:first-child,td:first-child { text-align:left }
  th { color:var(--dim); font-weight:normal; position:sticky; top:0; background:var(--panel) }
  #log { height:320px; overflow:auto; background:#0b0e13; border:1px solid var(--line); border-radius:6px; padding:6px; white-space:pre-wrap; word-break:break-word }
  .l-note{color:#e6edf3} .l-info{color:#8b949e} .l-verb{color:#6e7681}
  .hit-crit{color:var(--crit);font-weight:bold} .hit-warn{color:var(--warn)} .hit-ok{color:var(--ok)}
  canvas { width:100%; background:#0b0e13; border:1px solid var(--line); border-radius:6px; display:block }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap }
  .muted { color:var(--dim) }
  .err { color:var(--crit) }

  /* ── skill tiles: an MMO action bar. 8 per row, so 24 learned skills = 3 rows. ──────────────────
     State is carried the way a game client carries it, not as a table column:
       • READY      → lit border
       • COOLING    → dim border + seconds remaining + a radial sweep darkening the remaining fraction
       • UNKNOWN cd → dashed border. A skill whose DelayTime we cannot read must NOT look ready. */
  /* 75% of the old width, 50% of the old height (was a 1:1 square filling 1/8 of the row). */
  /* Skill tiles are a GRID OF SLOTS like the bag (operator 2026-08-13: "similar tile grid like
     inventory slots"), drawing the client's own skill art from ActiveSkillView.shn. */
  .tiles { display:grid; grid-template-columns:repeat(6, 40px); gap:3px; justify-content:start }
  .tile img { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; image-rendering:pixelated; z-index:0 }
  /* Buff/debuff bar, half the tile size, sitting above the skills. */
  .abbar { display:flex; flex-wrap:wrap; gap:3px; margin-bottom:6px; min-height:20px }
  .abchip { position:relative; width:20px; height:20px; border-radius:3px; background:#0d1117;
            border:1px solid #2b3440; overflow:hidden; cursor:default }
  .abchip img { width:100%; height:100%; object-fit:contain; image-rendering:pixelated }
  .abchip .ab { font-size:7px; line-height:20px; text-align:center; color:var(--dim); display:block }
  .tile { position:relative; aspect-ratio:1; border-radius:4px; background:#0b0e13;
          border:2px solid #2b3440; overflow:hidden; display:flex; align-items:center; justify-content:center;
          padding:1px; text-align:center; cursor:default }
  .tile .nm { font-size:12px; line-height:1.1; color:var(--fg); word-break:break-word; z-index:2;
              display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden }
  .tile.ready { border-color:var(--ok); box-shadow:0 0 4px rgba(63,185,80,.35) }
  .tile.cool  { border-color:#3d444d }
  .tile.cool .nm { color:var(--dim) }
  .tile.unk   { border-style:dashed; border-color:var(--warn) }
  .tile .cd { position:absolute; bottom:1px; right:2px; font-size:9px; color:var(--warn); z-index:3 }
  /* the radial sweep: conic-gradient darkens the portion of the cooldown still to run */
  .tile .sweep { position:absolute; inset:0; z-index:1; pointer-events:none }
  /* MOUNT chip: same 20px footprint as an abstate, lit when mounted so it reads at a glance. Always
     present — "on foot" is an answer, not an absence. */
  .abchip.mount { border-color:#3d444d }
  .abchip.mount.on { border-color:var(--ok); box-shadow:0 0 4px rgba(63,185,80,.35) }
  .abchip.mount .ab { font-size:12px; line-height:20px }
  /* SOUL STONE tiles: identical to skill tiles (same grid, same sweep), on their own short row so the
     two most-pressed buttons in a fight are not buried among 30 skills. `out` = none left / depleted. */
  .stonerow { grid-template-columns:repeat(2, 40px); margin-bottom:6px }
  .tile.stone .nm { font-size:11px; font-weight:600 }
  .tile.stone.out { border-color:var(--bad); opacity:.55 }
  .tile.stone.out .nm { color:var(--dim) }

  .maps { display:grid; grid-template-columns:1fr 1fr; gap:10px; max-width:660px }  /* 1.5x the -33% pass */

  /* Foldable cards. Default OPEN; the open/closed choice persists in localStorage. */
  h2.fold { cursor:pointer; user-select:none; display:flex; align-items:center; gap:6px }
  h2.fold .chev { display:inline-block; transition:transform .15s; font-size:10px }
  .panel.closed h2.fold .chev { transform:rotate(-90deg) }
  .panel.closed .body { display:none }
  .skopts { display:flex; gap:12px; font-size:11px; color:var(--dim); margin:0 0 6px }
  .skopts label { display:flex; align-items:center; gap:4px; cursor:pointer }

  /* fold-out death reports under the console */
  #deaths { max-height:300px; overflow:auto; margin-top:6px }
  #deaths details { border:1px solid var(--line); border-radius:5px; margin-bottom:5px; background:#0b0e13 }
  #deaths summary { cursor:pointer; padding:4px 6px; color:var(--crit) }
  #deaths pre { margin:0; padding:6px; white-space:pre-wrap; word-break:break-word; color:var(--dim); font-size:11px }

  /* toaster — bottom-right, newest on top, auto-expiring */
  #toasts { position:fixed; right:14px; bottom:14px; display:flex; flex-direction:column-reverse; gap:6px; z-index:50 }
  .toast { background:#161b22; border:1px solid var(--line); border-left:3px solid var(--accent);
           border-radius:5px; padding:6px 10px; box-shadow:0 2px 10px rgba(0,0,0,.45);
           animation:tin .18s ease-out; max-width:360px }
  .toast.kill  { border-left-color:var(--accent) }
  .toast.goal  { border-left-color:var(--warn) }
  .toast.hand  { border-left-color:var(--ok) }
  .toast .q { color:var(--fg) } .toast .sep { color:var(--dim); margin:0 6px }
  @keyframes tin { from { opacity:0; transform:translateY(6px) } to { opacity:1; transform:none } }
  /* Fixed height, not auto: the legend's line count changes with whatever wandered into view, and an
     auto-height box shifted every panel below it up and down on a 5/sec redraw. Reserve the space and
     scroll inside it instead. */
  .legend { margin-top:6px; display:flex; flex-wrap:wrap; align-content:flex-start; gap:4px 10px;
            font-size:11px; color:var(--dim); height:78px; overflow-y:auto }
  .legend b { color:var(--fg); font-weight:normal }
  /* The global `th,td { white-space:nowrap }` made this table refuse to wrap, so a long status string
     ("instance-only (Tower of Iyzel) — needs a party; shelved") forced the panel far wider than the
     screen while the rest of the row sat empty. Fixed layout + wrapping keeps it inside the card. */
  #quests { table-layout:fixed; width:100% }
  #quests td { white-space:normal; overflow-wrap:anywhere }
  #quests col.c-name { width:auto }
  #quests col.c-num  { width:88px }
  #quests col.c-stat { width:34% }
  #quests col.c-here { width:70px }
  tr.qh td { border-bottom:none; padding-top:6px }
  tr.qg td { color:var(--dim); font-size:11px; border-bottom:1px solid var(--line) }
  tr.qfocus td { background:rgba(88,166,255,.08) }
  .focus { border:1px solid var(--line); border-left:3px solid var(--accent); border-radius:5px;
           background:#0b0e13; padding:5px 8px; margin-bottom:6px; font-size:12px }
  button.mini { background:#0b0e13; color:var(--dim); border:1px solid var(--line); border-radius:3px;
                font:inherit; font-size:10px; padding:0 5px; cursor:pointer; margin-left:6px }
  button.mini:hover { color:var(--fg); border-color:var(--accent) }

/* ITEMS — a bag that looks like the bag (operator 2026-08-12). The art is the client's own icon
   atlas, served by /icon/<itemId>.png; when it is absent the tile falls back to the item's NAME so
   the panel stays useful on a host with no icon dir rather than showing a grid of broken images. */
.isec { color:#8b949e; font-size:11px; text-transform:uppercase; letter-spacing:.5px; margin:8px 0 4px }
/* The bag is drawn as the GAME draws it: pages of 6 wide x 4 high, with a gap between pages
   (operator 2026-08-13). An auto-fill grid reflowed to whatever width the panel happened to be, so a
   slot's position on screen meant nothing and could not be compared against the client's own bag.
   EQUIPMENT keeps its old single-row flow (.irow) — it is a handful of slots, not a paged bag, and
   stacking it into the bag's column layout was collateral damage from sharing one class. */
/* Pages sit SIDE BY SIDE, two per row (operator 2026-08-13), so today's 2 pages read as one
   12x4 bag and a future 6 pages would lay out 2x3. */
.igrid { display:grid; grid-template-columns:repeat(2, max-content); gap:10px; justify-content:start }
.irow  { display:flex; flex-wrap:wrap; gap:3px }
.irow .islot { width:40px }
/* FIXED 40px columns, not 1fr: the slot size was already right, the layout was not. An auto-fill grid
   reflowed to the panel width (it was rendering ~10 wide), and 6x`1fr` then over-corrected by stretching
   each slot to a sixth of the panel. Six 40px columns keeps the icon size and gives the client's own
   6-wide x 4-high page, with the flex gap above marking the page boundary. */
.ipage { display:grid; grid-template-columns:repeat(6, 40px); gap:3px; justify-content:start }
.islot { position:relative; aspect-ratio:1; background:#0d1117; border:1px solid #21262d; border-radius:3px;
         display:flex; align-items:center; justify-content:center; overflow:hidden }
.islot.empty { background:#0b0e13; border-style:dashed; border-color:#161b22 }
.islot img { width:32px; height:32px; image-rendering:pixelated }
.islot .nm { font-size:8px; line-height:1.05; color:#7d8590; text-align:center; padding:2px; word-break:break-word }
.islot .ct { position:absolute; right:1px; bottom:0; font-size:9px; font-weight:700; color:#fff;
             text-shadow:0 0 3px #000,0 0 2px #000; pointer-events:none }
.islot .eq { position:absolute; left:1px; top:0; font-size:8px; color:#58a6ff; text-shadow:0 0 3px #000 }
</style>

<header>
  <strong>bot watch</strong>
  <!-- A DROPDOWN of the bots that actually exist, not a name to retype. With several bots running at
       once, typing an id to switch is both slow and silently wrong when you fat-finger it — a bad name
       just makes every panel 404 with no hint that the NAME is what is wrong. -->
  <label>bot <select id="bot"></select></label>
  <button class="mini" id="relogbtn" onclick="relogBot()"
    title="Clean logout → re-login in place, re-applying the same script. The recovery for a wedged bot.
⚠️ The bot 404s for a few seconds while the handle is replaced, and its ring buffer RESTARTS EMPTY — copy anything you need from the log first.">relog</button>
  <button class="mini" id="saybtn" onclick="toggleAnnounce()"
    title="Narrate what the bot is doing into GAME CHAT: phase and tactic changes (chase / kite / shed / retaliate)
and every cast failure with the distance the bot BELIEVED at the time.
Visible to other players and rate-limited server-side, so it is for watching, not for leaving on.">say: ?</button>
  <label>token <input id="tok" type="password" size="16" placeholder="bearer"></label>
  <label>log level
    <select id="lvl"><option>note</option><option selected>info</option><option>verbose</option></select>
  </label>
  <label>map <select id="mapsel"><option value="">(current)</option></select></label>
  <label><input type="checkbox" id="recent" checked> heatmap: last 30m only</label>
  <span id="status" class="muted"></span>
</header>

<div id="toasts"></div>

<div class="wrap">
  <div>
    <div class="panel" style="margin-bottom:10px">
      <h2 class="fold" data-card="live"><span class="chev">▼</span>live</h2>
      <div class="body"><div id="vitals"></div></div>
    </div>
    <div class="panel">
      <h2 class="fold" data-card="character"><span class="chev">▼</span>character</h2>
      <div class="body"><div id="charsheet"></div></div>
    </div>
  </div>

  <div>
    <div class="panel" style="margin-bottom:10px">
      <h2 class="fold" data-card="skills"><span class="chev">▼</span>skills <span class="muted" id="skhint"></span></h2>
      <div class="body">
        <div class="skopts">
          <label><input type="checkbox" id="skmisc"> show misc</label>
          <label><input type="checkbox" id="sklevels"> show all levels</label>
        </div>
        <div id="abstates" class="abbar"></div>
        <!-- Soul stones sit with the skills because they ARE used like one: a cooldown-gated button the
             bot presses mid-fight. Same tile size and the same sweep, per the operator. -->
        <div id="stones" class="tiles stonerow"></div>
        <div id="skills" class="tiles"></div>
      </div>
    </div>

    <div class="panel" style="margin-bottom:10px">
      <h2 class="fold" data-card="items"><span class="chev">▼</span>items <span class="muted" id="ihint"></span></h2>
      <div class="body">
        <div class="isec">worn</div>
        <div id="worn" class="irow"></div>
        <div class="isec">bag <span class="muted" id="bagcap"></span></div>
        <div id="bag" class="igrid"></div>
      </div>
    </div>

    <div class="panel" style="margin-bottom:10px">
      <h2 class="fold" data-card="maps"><span class="chev">▼</span>maps <span class="muted" id="mapname"></span></h2>
      <div class="body">
      <div class="maps">
        <div>
          <div class="muted" style="margin-bottom:4px">big map — where it's been</div>
          <canvas id="heat" width="320" height="320"></canvas>
          <div id="mapinfo" class="muted" style="margin-top:6px"></div>
        </div>
        <div>
          <div class="muted" style="margin-bottom:4px">combat map — self centred, <span id="cmscale"></span>
            <select id="cmzoom" style="margin-left:6px;background:#0b0e13;color:#e6edf3;border:1px solid #1b2430;font:inherit">
              <option value="150">150u — contact</option>
              <option value="300">300u — melee</option>
              <option value="900" selected>900u — engagement</option>
              <option value="2500">2500u — area</option>
              <option value="8000">8000u — region</option>
            </select></div>
          <canvas id="combat" width="320" height="320"></canvas>
          <div id="legend" class="legend"></div>
        </div>
      </div>
      </div>
    </div>

    <div class="panel" style="margin-bottom:10px">
      <h2 class="fold" data-card="quests"><span class="chev">▼</span>quests <span class="muted" id="qhint"></span></h2>
      <div class="body">
        <!-- The DRIVER's own statement of intent, above the board. The board's ORDER only mirrors the
             driver's sort, so without this there is no way to tell which quest it actually picked, or
             why it is walking somewhere. -->
        <div id="focus" class="focus"></div>
        <div style="max-height:220px; overflow:auto"><table id="quests"></table></div>
      </div>
    </div>

    <div class="panel" style="margin-bottom:10px">
      <h2 class="fold" data-card="console"><span class="chev">▼</span>console
        <span class="muted">(severity filter above)</span>
        <label class="muted" style="margin-left:auto; font-size:11px; display:flex; align-items:center; gap:4px; cursor:pointer"
               onclick="event.stopPropagation()"><input type="checkbox" id="noscroll"> stop autoscroll</label>
      </h2>
      <div class="body">
      <div id="log"></div>
      <details id="deathsbox" style="margin-top:8px">
        <summary style="cursor:pointer; color:var(--dim)">recent deaths <span id="dcount"></span></summary>
        <div id="deaths"></div>
      </details>
      </div>
    </div>

    <div class="panel">
      <h2 class="fold" data-card="metrics"><span class="chev">▼</span>metrics <span class="muted" id="mwin"></span></h2>
      <div class="body"><div style="max-height:340px; overflow:auto"><table id="metrics"></table></div></div>
    </div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
// body is optional and additive: every existing caller passes at most three arguments, and a POST with no body
// still behaves exactly as before. Without it a toggle can only ever send its default, i.e. it can turn a thing
// ON and never off.
const api = (p, q={}, method='GET', body=null) => {
  // The picker is populated asynchronously, so the first tick can fire before any bot is selected.
  // Return a not-ok response rather than requesting /api/bots//metrics, which 404s and paints an error
  // over a page that is merely still starting up.
  const who = $('#bot').value;
  if (!who) return Promise.resolve({ ok:false, status:0, json:async()=>({}), text:async()=>'' });
  const u = new URL(`/api/bots/${encodeURIComponent(who)}${p}`, location.origin);
  for (const [k,v] of Object.entries(q || {})) if (v !== undefined && v !== null && v !== '') u.searchParams.set(k,v);
  const tok = $('#tok').value.trim();
  const headers = tok ? { Authorization:'Bearer '+tok } : {};
  if (body !== null && body !== undefined) headers['Content-Type'] = 'application/json';
  return fetch(u, { method, headers, body: (body === null || body === undefined) ? undefined : JSON.stringify(body) });
};
const num = v => v === null || v === undefined ? '—'
  : (typeof v === 'number' ? (Number.isInteger(v) ? v : v.toFixed(2)) : v);

// ── live + metrics ────────────────────────────────────────────────────────────────────────────────
function vitals(l) {
  const pct = (a,b) => (a!=null && b) ? Math.max(0, Math.min(100, 100*a/b)) : 0;
  const bar = (a,b,col) => `<div class="bar"><i style="width:${pct(a,b)}%;background:${col}"></i></div>`;
  const dps = l.incomingDps5s, heal = l.sustainableHealDps;
  const losing = (dps>0 && heal>0 && dps>heal);
  return `
    <div class="kv">
      <div>phase</div><div>${l.phase ?? '—'}</div>
      <div>map</div><div>${l.mapDisplay ? `${l.mapDisplay} <span class="muted">(${l.map})</span>` : (l.map ?? '—')} <span class="muted">${l.position ?? ''}</span></div>
      <div>level</div><div>${num(l.level)} <span class="muted">exp ${num(l.exp)}</span></div>
      <div>money</div><div>${num(l.money)}</div>
    </div>
    <div style="margin-top:8px">hp ${num(l.hp)}/${num(l.maxHp)}${bar(l.hp,l.maxHp,'var(--ok)')}
    sp ${num(l.sp)}/${num(l.maxSp)}${bar(l.sp,l.maxSp,'var(--accent)')}</div>
    <div class="kv">
      <div>stones</div><div>hp ${num(l.hpStones)} · sp ${num(l.spStones)}</div>
      <div>bag</div><div>${num(l.bagUsed)} used · ${num(l.bagFree)} free <span class="muted">/ ${num(l.bagCapacity)} (inferred)</span>${l.bagFullServerSignal ? ' <span class="hit-warn">last pickup FAILED (0x346)</span>' : ''}</div>
      <div>combat</div><div>${l.inCombat ? 'YES' : 'no'} · aggro ${num(l.aggressors)}${l.nearestAggressorDist!=null?` @${num(l.nearestAggressorDist)}u`:''}</div>
      <div>mounted</div><div>${l.mounted ? 'yes' : 'no'}${l.dead ? ' · <span class="err">DEAD</span>' : ''}</div>
      <div>incoming</div><div class="${losing?'hit-crit':''}">${num(dps)} dmg/s</div>
      <div>heal cap</div><div>${heal!=null?num(heal)+' hp/s':'<span class="muted">unknown</span>'}</div>
    </div>
    ${losing ? '<div class="hit-crit" style="margin-top:6px">incoming exceeds sustainable healing — this fight cannot be out-healed</div>' : ''}
    <div class="muted" style="margin-top:6px">${l.script ?? ''}</div>`;
}

// ── MINIMAP LAYER (the client's own art, under both canvases) ─────────────────────────────────────
// Operator 2026-08-13: "I want the /watch UI to actually display the minimap as the real client does,
// it's a bit hard to follow locations otherwise." So both maps draw the real per-map art underneath.
//
// PROJECTION (measured — tools/minimap_orient.py, see MinimapImage.cs): the image spans the FULL square
// .shbd grid, world [0, worldWidth] x [0, worldHeight], with the Y AXIS FLIPPED:
//     imgX = worldX / worldWidth * imgW        imgY = (1 - worldY / worldHeight) * imgH
// flipY beat every other orientation on every map that discriminates (EldGbl02 0.880 vs 0.415 identity)
// and never lost. Towns are inconclusive because they are mostly rooftops.
//
// A map with no art (several instances) simply leaves the canvas background — the markers still draw,
// so the panel degrades to what it was before rather than breaking.
// Declared HERE, above both minimap() and tickTrace(): both are reached before the render loop's own code, and a
// `let` read before its declaration is a TDZ ReferenceError rather than an undefined -- it would throw on the very
// first poll or the first art load.
// bigMapUrgent bypasses the repaint throttle for STRUCTURAL changes (a new map, or its art finishing loading), as
// opposed to the routine "a trace point arrived" dirtying. See frame().
let bigMapDirty = true, bigMapUrgent = false, lastBigDraw = 0;
const mmCache = new Map();          // map -> {img, meta, failed}
function minimap(map) {
  if (!map) return null;
  let e = mmCache.get(map);
  if (e) return e.failed ? null : e;
  e = { img: null, meta: null, failed: false };
  mmCache.set(map, e);
  // EVERY exit from this fetch repaints the big map, because every one of them CHANGES WHAT IT SHOULD DRAW --
  // new art, or a settled "there is no art for this map". The combat map repaints on every animation frame, so it
  // picked new art up ~16ms after the PNG decoded; the big map only repaints when bigMapDirty is set, and nothing
  // here set it. It therefore kept the OLD map's art until some unrelated event (a trace point, a poll) dirtied it.
  // Operator, 2026-08-20: "Combat map still changes over to the new background image like 0.2 secs before the big
  // map. Feels weird!" -- that gap was this, plus the repaint throttle below.
  const repaintBig = () => { bigMapDirty = true; bigMapUrgent = true; };
  fetch(`/minimap/${encodeURIComponent(map)}.json`).then(r => r.ok ? r.json() : null).then(m => {
    if (!m || !m.worldWidth) { e.failed = true; repaintBig(); return; }   // no grid loaded => cannot place art
    e.meta = m;
    const im = new Image();
    im.onload = () => { e.img = im; repaintBig(); };
    im.onerror = () => { e.failed = true; repaintBig(); };
    im.src = `/minimap/${encodeURIComponent(map)}.png`;
  }).catch(() => { e.failed = true; repaintBig(); });
  return e;
}
// Paint the sub-rectangle of the minimap covering world [wx0,wy0]-[wx1,wy1] into the DESTINATION rect
// [dx,dy,dw,dh]. The destination is explicit rather than "the whole canvas" because both callers letterbox
// and pad: the big map insets by `pad` and the combat map by 6px, so filling the canvas would offset the
// art from the very markers it sits under. Callers pass the same world rect they project markers with.
function drawMinimapInto(g, map, wx0, wy0, wx1, wy1, dx, dy, dw, dh, alpha) {
  const e = minimap(map);
  if (!e || !e.img || !e.meta) return false;
  // The image covers coverX0..coverX1 / coverY0..coverY1 in WORLD units — from the client's own
  // MapViewInfo.shn, NOT the whole grid. Most maps cover everything, but RouN and Eld cover a
  // sub-rectangle and assuming the full grid stretched them.
  const cx0 = e.meta.coverX0, cy0 = e.meta.coverY0, cx1 = e.meta.coverX1, cy1 = e.meta.coverY1;
  const cw = cx1 - cx0, ch = cy1 - cy0;
  if (!(cw > 0 && ch > 0)) return false;
  const iw = e.img.width, ih = e.img.height;
  const sx = ((wx0 - cx0) / cw) * iw, sw = ((wx1 - wx0) / cw) * iw;
  // Y flip: the TOP of the canvas is the HIGH world y, which is the LOW image row.
  const sy = (1 - (wy1 - cy0) / ch) * ih, sh = ((wy1 - wy0) / ch) * ih;
  g.save();
  g.globalAlpha = alpha == null ? 1 : alpha;
  g.imageSmoothingEnabled = true;
  // Clip, because a world rect can extend past the image edge (the combat map's window near a border)
  // and drawImage would otherwise stretch the clamped source across the whole destination.
  g.beginPath(); g.rect(dx, dy, dw, dh); g.clip();
  try { g.drawImage(e.img, sx, sy, sw, sh, dx, dy, dw, dh); } catch {}
  g.restore();
  return true;
}
// One NPC marker + name tag, drawn the same way on both canvases so they read alike.
// Gates are called out separately: "where does this lead" is the thing you want off a gate.
function drawNpcMarker(g, px, py, name, isGate, linkMap) {
  g.save();
  // Gates render exactly like NPCs (operator 2026-08-13) — same diamond, same name-tag plate. Only the
  // colour differs, so a gate is still identifiable without becoming a second visual language.
  g.beginPath();
  g.moveTo(px, py - 4); g.lineTo(px + 4, py); g.lineTo(px, py + 4); g.lineTo(px - 4, py); g.closePath();
  g.fillStyle = isGate ? 'rgba(188,140,255,.95)' : 'rgba(86,211,236,.95)';
  g.fill();
  g.strokeStyle = 'rgba(0,0,0,.65)'; g.lineWidth = 1; g.stroke();
  const label = isGate ? (linkMap || name || 'gate') : name;
  if (label) {
    g.font = '9px ui-monospace,monospace';
    g.textAlign = 'center'; g.textBaseline = 'bottom';
    const w = g.measureText(label).width;
    g.fillStyle = 'rgba(0,0,0,.55)';                 // plate, so names stay legible over the art
    g.fillRect(px - w / 2 - 2, py - 15, w + 4, 11);
    g.fillStyle = isGate ? '#d2b3ff' : '#8ee7f5';
    g.fillText(label, px, py - 5);
  }
  g.restore();
}

// ── combat map ────────────────────────────────────────────────────────────────────────────────────
// Zoomed right in, self always dead centre. Each mob is a circle carrying a NUMBER; the legend below
// maps number → name, so the map stays readable when a dozen of the same mob are on screen.
// Rings, outermost first:
//   • gold  = an objective of a currently ACTIVE quest (kill OR collect)
//   • red   = DANGEROUS, learned from the wire: the biggest hit this mob type has actually landed on us
//             is a large share of our max HP. A mob that has never hit us is UNKNOWN, not safe, and gets
//             no ring rather than a reassuring one.
//   • fill  = solid when it is currently aggro'd onto us, hollow otherwise.
// Zoom is SELECTABLE (operator 2026-08-11). CM_RANGE = units from centre to edge.
// ⚠️ Clustering must scale WITH the zoom or the map lies in both directions: CLUSTER_PX is a
// SCREEN-space radius, so at 8000u it would merge mobs that are hundreds of units apart into one
// blob, and at 150u it would split a single pack standing on one spot. The merge distance is
// therefore defined in WORLD units and converted to pixels per frame, so "what counts as one pack"
// means the same thing at every zoom level.
let CM_RANGE = 900;
const CLUSTER_WORLD_U = 70;   // mobs within this many world units read as one pack, at any zoom
function drawCombat(ent, maxHp) {
  const c = $('#combat'), g = c.getContext('2d');
  const W = c.width, H = c.height, cx = W/2, cy = H/2;
  g.clearRect(0,0,W,H); g.fillStyle = '#0b0e13'; g.fillRect(0,0,W,H);
  $('#cmscale').textContent = `±${CM_RANGE}u`;
  const pxPerU = (W/2-6)/CM_RANGE;
  if (!ent || !ent.self) { $('#legend').innerHTML = '<span class="muted">no position yet</span>'; return; }

  // range rings so distances are readable at a glance
  g.strokeStyle = '#1b2430';
  for (const r of [0.33, 0.66, 1]) { g.beginPath(); g.arc(cx, cy, r*(W/2-6), 0, Math.PI*2); g.stroke(); }

  const sx = ent.self.x, sy = ent.self.y;
  // ⚠️ Y IS FLIPPED HERE (changed 2026-08-13) — world +y draws UPWARD, matching the big map and the
  // minimap art now painted underneath. It previously drew +y downward; with the client's own terrain
  // on the canvas, "north is down" would put the picture at odds with the game the operator is watching.
  // THE FACING ARROW BELOW USES THE SAME CONVENTION AND MUST BE CHANGED WITH IT — an earlier version had
  // the arrow mirrored against its own mobs and the operator caught it. Both flip together or neither does.
  const toPx = (x,y) => [cx + ((x-sx)/CM_RANGE)*(W/2-6), cy - ((y-sy)/CM_RANGE)*(H/2-6)];

  // The client's own art underneath, framed on exactly the window we project into. toPx maps
  // ±CM_RANGE onto ±(W/2-6), so the destination is the canvas inset by that same 6px.
  drawMinimapInto(g, ent.map, sx-CM_RANGE, sy-CM_RANGE, sx+CM_RANGE, sy+CM_RANGE,
                  cx-(W/2-6), cy-(H/2-6), (W-12), (H-12), 0.55);
  // Re-draw the range rings on top of the art, or they vanish into it.
  g.strokeStyle = 'rgba(120,140,165,.35)';
  for (const r of [0.33, 0.66, 1]) { g.beginPath(); g.arc(cx, cy, r*(W/2-6), 0, Math.PI*2); g.stroke(); }

  // NPCs from the map-enter seed (operator: a marker + name tag, not a mob-like blob). Only those
  // inside the zoom window; the seed covers the whole map and would otherwise pile up at the edges.
  for (const n of ent.npcs||[]) {
    const [px,py] = toPx(n.x, n.y);
    if (px < 4 || py < 12 || px > W-4 || py > H-4) continue;
    drawNpcMarker(g, px, py, n.name, n.isGate, n.linkMap);
  }

  // number the DISTINCT mob types present, so the legend is short
  const types = []; const numOf = new Map();
  for (const m of ent.mobs||[]) if (!numOf.has(m.mobId)) { numOf.set(m.mobId, types.length+1); types.push(m); }

  // CLUSTER overlapping mobs (operator P0): packs stand on top of each other and a circle per mob was an
  // unreadable smear. Group anything within CLUSTER_PX and draw ONE circle listing "count x legendNumber"
  // per type inside it. Radius grows with the population so a big pack reads as big.
  const CLUSTER_PX = Math.max(6, CLUSTER_WORLD_U * pxPerU);   // world-space merge, expressed in px
  const clusters = [];
  for (const m of ent.mobs||[]) {
    const [px,py] = toPx(m.x, m.y);
    if (px < -20 || py < -20 || px > W+20 || py > H+20) continue;   // outside the zoom window
    let c = clusters.find(k => Math.hypot(k.x-px, k.y-py) <= CLUSTER_PX);
    if (!c) { c = { x:px, y:py, n:0, types:new Map(), aggro:false, quest:false, danger:false }; clusters.push(c); }
    // Keep the circle centred on the pack, not on whichever mob happened to be first.
    c.x = (c.x*c.n + px)/(c.n+1); c.y = (c.y*c.n + py)/(c.n+1); c.n++;
    const key = m.name || `mob${m.mobId}`;      // key by NAME: the tag on the map is the name itself
    c.types.set(key, (c.types.get(key)||0) + 1);
    if (m.aggro) c.aggro = true;
    if (m.questMob) c.quest = true;
    if (maxHp > 0 && m.maxHitSeen > 0 && m.maxHitSeen >= maxHp*0.15) c.danger = true;
  }
  // NAME TAGS, not legend numbers (operator 2026-08-13: "it's really hard to tell enemies apart on the
  // combat map. please put a small nametag above them instead of the 'legend'"). The number→name legend
  // forced a lookup off-canvas for every glance; the name goes on the mob. A cluster of mixed types lists
  // each with its count. Names are truncated rather than wrapped so a pack cannot cover the map.
  g.textAlign = 'center'; g.textBaseline = 'middle';
  const short = s => (s||'?').length > 16 ? (s.slice(0,15) + '…') : (s||'?');
  for (const c of clusters) {
    const tags = [...c.types.entries()].sort((a,b) => b[1]-a[1])
      .map(([name,n]) => n > 1 ? `${n}× ${short(name)}` : short(name));
    const r = Math.max(7, Math.min(22, 7 + 1.4*c.n));
    g.beginPath(); g.arc(c.x, c.y, r, 0, Math.PI*2);
    g.fillStyle = c.aggro ? 'rgba(248,81,73,.55)' : 'rgba(125,133,144,.30)';
    g.fill();
    if (c.danger) { g.strokeStyle = '#f85149'; g.lineWidth = 2; g.stroke(); }
    if (c.quest)  { g.beginPath(); g.arc(c.x, c.y, r+3, 0, Math.PI*2); g.strokeStyle = '#d4a017'; g.lineWidth = 2; g.stroke(); }
    // Tag ABOVE the circle, on a plate so it stays readable over the terrain art.
    g.font = '9px ui-monospace,monospace';
    g.textBaseline = 'bottom';
    let ty = c.y - r - 3;
    for (const t of tags.slice(0, 3).reverse()) {
      const w = g.measureText(t).width;
      g.fillStyle = 'rgba(0,0,0,.55)';
      g.fillRect(c.x - w/2 - 2, ty - 10, w + 4, 11);
      g.fillStyle = c.aggro ? '#ffb4ae' : '#e6edf3';
      g.fillText(t, c.x, ty);
      ty -= 11;
    }
    g.textBaseline = 'middle';
  }
  for (const p of ent.party||[]) {
    if (!p.x && !p.y) continue;         // MEMBERLOCATION layout not pinned → 0,0 means UNKNOWN, don't draw
    const [px,py] = toPx(p.x, p.y);
    g.beginPath(); g.arc(px, py, 7, 0, Math.PI*2); g.fillStyle = 'rgba(88,166,255,.7)'; g.fill();
  }
  // ── WHERE WE ARE TRYING TO GO ────────────────────────────────────────────────────────────────
  // Operator P0 2026-08-18: the map drew where the bot IS but never where it was HEADING, so "is it even
  // going anywhere?" could only be answered from the tail. self.walkPath is the simplified route actually
  // handed to WalkPath and self.walkTo its final waypoint, so a detour around geometry reads as a detour
  // rather than as the bot wandering off. Nothing walking = nothing drawn, which is itself the useful
  // signal: a motionless bot with no line is idle by decision, not stuck mid-route.
  if (ent.self.walkTo) {
    const wp = (ent.self.walkPath || []).map(w => toPx(w[0], w[1]));
    g.save();
    g.setLineDash([5,4]); g.lineWidth = 1.5; g.strokeStyle = "rgba(88,166,255,.85)";
    g.beginPath(); g.moveTo(cx, cy);
    for (const [x,y] of wp) g.lineTo(x, y);
    if (!wp.length) { const [tx,ty] = toPx(ent.self.walkTo.x, ent.self.walkTo.y); g.lineTo(tx, ty); }
    g.stroke();
    g.setLineDash([]);
    // Intermediate waypoints as small ticks, so a 30-hop path is visibly a PATH and not one long ray.
    g.fillStyle = "rgba(88,166,255,.55)";
    for (let i = 0; i < wp.length - 1; i++) g.fillRect(wp[i][0]-1.5, wp[i][1]-1.5, 3, 3);
    // The destination. It is usually OUTSIDE the zoom window (a cross-map walk is thousands of units),
    // so clamp it to the canvas edge and keep the true distance in the label — a marker pinned at the
    // rim that says 8,700u is honest; silently dropping it would look like the bot has no destination.
    let [dx, dy] = toPx(ent.self.walkTo.x, ent.self.walkTo.y);
    const dist = Math.hypot(ent.self.walkTo.x - sx, ent.self.walkTo.y - sy);
    const off = dx < 8 || dy < 8 || dx > W-8 || dy > H-8;
    dx = Math.max(8, Math.min(W-8, dx)); dy = Math.max(14, Math.min(H-8, dy));
    g.strokeStyle = "#58a6ff"; g.lineWidth = 2;
    g.beginPath(); g.arc(dx, dy, 5, 0, 7); g.stroke();
    g.beginPath(); g.moveTo(dx-8, dy); g.lineTo(dx+8, dy); g.moveTo(dx, dy-8); g.lineTo(dx, dy+8); g.stroke();
    g.fillStyle = "#58a6ff"; g.font = "10px ui-monospace,monospace"; g.textAlign = "center";
    g.fillText(`${off ? "→ " : ""}${Math.round(dist)}u`, dx, dy - 9);
    g.restore();
  }
  // ── FACING ARROW + TARGET RAY ────────────────────────────────────────────────────────────────
  // Operator 2026-08-11: show which way the bot is POINTED. Drawn together with a dashed ray to the
  // current target, because the pair is what actually diagnoses the open combat bug — if we overshoot
  // a mob (or meet its stand-off circle on the wrong side) the target ends up BEHIND us, which fails
  // casts and produces swing-less bashes at the same time. Two rays make that instant; numbers hide it.
  // Facing null = never set. Draw NOTHING then — a default 0° would be a confident arrow pointing east.
  if (ent.self.facing != null) {
    // ⚠️ USE THE SAME y CONVENTION AS toPx, WHICH DOES NOT FLIP (it plots cy + (y-sy)*scale, so world
    // +y is drawn DOWNWARD). The first version negated sin here "because screen y grows downward" and
    // the arrow came out mirrored against the very mobs it shares a canvas with (operator caught it).
    // Whether the world's y points north is irrelevant to this canvas -- what matters is that the arrow
    // and the mob dots agree, or the picture is worse than no picture.
    const a = ent.self.facing * Math.PI/180, L = 26;
    const ex = cx + Math.cos(a)*L, ey = cy - Math.sin(a)*L;   // -sin: toPx flips y, so this must too
    g.strokeStyle = '#3fb950'; g.lineWidth = 2;
    g.beginPath(); g.moveTo(cx, cy); g.lineTo(ex, ey); g.stroke();
    g.beginPath();                                  // arrow head, same convention as the shaft
    g.moveTo(ex, ey);
    g.lineTo(ex - Math.cos(a-0.4)*7, ey + Math.sin(a-0.4)*7);
    g.lineTo(ex - Math.cos(a+0.4)*7, ey + Math.sin(a+0.4)*7);
    g.closePath(); g.fillStyle = '#3fb950'; g.fill();
  }
  // Target ray. Driven by the server-side TARGET VIEW (ent.target), not by a lookup in the mob list:
  // the JCQ shadow clone is a PLAYER entity, so a mobs-only search drew no ray for the one fight this
  // page exists to diagnose. `asserted` — not a non-zero handle — is what says a selection exists.
  const tv = ent.target;
  if (tv && tv.asserted && tv.x != null) {
    const [tx,ty] = toPx(tv.x, tv.y);
    g.save(); g.setLineDash([3,3]);
    g.strokeStyle = '#d4a017'; g.lineWidth = 1.5;
    g.beginPath(); g.moveTo(cx, cy); g.lineTo(tx, ty); g.stroke();
    g.restore();
    // Ring the target so it is distinguishable from the pack it is standing in.
    g.beginPath(); g.arc(tx, ty, 11, 0, Math.PI*2);
    g.strokeStyle = '#d4a017'; g.lineWidth = 2; g.stroke();
  }
  // ── CURRENT TARGET, in words (operator 2026-08-12) ──────────────────────────────────────────
  // You can only auto-attack or cast at the entity the SERVER currently has selected, so "what are we
  // targeting" is a first-class combat fact — and it was only ever visible by reading packet logs.
  // Shows the raw handle even when the entity is NOT in view: "targeting a handle we cannot see" is
  // itself the diagnosis (the JCQ clone is a scripted player-copy that never enters the mob list).
  // LEVEL and HP decide the damage race; the ANGLE decides whether a cast is even accepted (a skill is
  // refused outside its UsableDegree arc, 45° for most melee skills). An unknown HP prints "?" — a mob
  // only reports its RestHp once something has hit it, and drawing that as full would invent the one
  // number the fight turns on.
  {
    const tc = $('#tgtcell');
    if (tc) {
      if (!tv || !tv.asserted) tc.innerHTML = '<span class="muted">none</span>';
      else {
        const n = (v, d, s='') => v == null ? '?' : (typeof v === 'number' ? v.toFixed(d) : v) + s;
        const hp = tv.hp == null ? '<span style="color:#d4a017">hp ?</span>'
                 : `hp ${tv.hp}${tv.maxHp ? '/' + tv.maxHp : '/?'}${tv.hpPct != null ? ` (${tv.hpPct}%)` : ''}`;
        // Off-arc is the actionable state, so colour it rather than leaving it in the grey run of numbers.
        const ang = tv.angleOffDeg == null ? '<span class="muted">ang ?</span>'
                  : `<span style="color:${tv.angleOffDeg > 22.5 ? '#f85149' : '#3fb950'}">ang ${tv.angleOffDeg.toFixed(0)}°</span>`;
        const head = tv.inView
          ? `<b>h${tv.handle}</b> ${tv.name || '?'} <span class="muted">[${tv.kind}]</span>`
          : `<b>h${tv.handle}</b> <span style="color:#f85149">NOT IN VIEW</span>`;
        const bits = [
          `L${n(tv.level, 0)}`,
          `${n(tv.dist, 0, 'u')}`,
          hp, ang,
          tv.heldSeconds != null ? `held ${tv.heldSeconds.toFixed(0)}s` : null,
          tv.scenarioFightable ? '<span style="color:#d4a017">SCENARIO</span>' : null,
          tv.aggro ? '<span style="color:#f85149">AGGRO</span>' : null,
          // Same handle in the player list and the mob list at different places = one of the two copies
          // is stale, and every distance/kite decision made from the wrong one is wrong.
          tv.posDisagreeU != null && tv.posDisagreeU > 1
            ? `<span style="color:#f85149">POS DISAGREE ${tv.posDisagreeU.toFixed(0)}u</span>` : null,
        ].filter(Boolean).join(' · ');
        tc.innerHTML = `${head} <span class="muted">${bits}</span>`
          + (tv.inView ? '' : ' <span class="muted">— selected but absent from both entity lists;'
             + ' a cast/bash cannot be aimed at what we cannot locate</span>');
      }
    }
  }
  // self last, on top
  g.beginPath(); g.arc(cx, cy, 5, 0, Math.PI*2); g.fillStyle = '#3fb950'; g.fill();

  // The per-mob legend is gone — every mob now carries its own name tag on the canvas. What is left is
  // the part a tag cannot express (what the rings and colours MEAN) plus the level/id detail, which is
  // useful but too long to hang over every circle.
  $('#legend').innerHTML = types.length
    ? '<span class="muted">gold ring = quest mob · red ring = has hit us hard · solid = aggro'
      + ' · green arrow = our facing · dashed gold = to current target · dashed blue = walk route, ⊕ = destination'
      + ' · <span style="color:#8ee7f5">◆ NPC</span> · <span style="color:#d2b3ff">■ gate</span></span>'
      + types.map(m => `<span class="muted">${m.name} (m${m.mobId}${m.level?` L${m.level}`:''})</span>`).join('')
    : '<span class="muted">nothing in view</span>';
}

// Skill TILES, like an MMO action bar. A skill with no cooldown length in client data gets a DASHED
// border, never a lit one — unknown must stay unknown, or the panel lies about what the bot can do.
// MISC = not a combat skill: Korean-named entries (the client ships a pile of them), plus gathering and
// mount skills. Hidden by default so the bar shows what the bot actually fights with. This is a DISPLAY
// filter on names — it changes nothing the bot does.
const HANGUL = /[ᄀ-ᇿ㄰-㆏ꥠ-꥿가-힯]/;
const MISC_RX = /(mining|gather|ride|mover|fishing|cooking|craft)/i;
// Server-side DATA flag first (ActiveSkill.DemandType==2 = gathering/mount/event toy). The name tests
// stay only as a fallback for builds without the flag — a blocklist of names kept leaking new toys
// (Mining, Ride Mover, Water Cannon, Cake/Soda summons all slipped through).
const isMisc = s => s.misc === true || (s.misc === undefined && (() => { const n = s.name || ''; return !n || HANGUL.test(n) || MISC_RX.test(n); })());
// Skills come as "Name [01]", "Name [02]" — the same skill at successive ranks. Default to the HIGHEST
// rank only, since the lower ones are superseded and just crowd the bar.
const baseName = n => (n || '').replace(/\s*\[\d+\]\s*$/, '').trim();
const rankOf  = n => { const m = /\[(\d+)\]\s*$/.exec(n || ''); return m ? Number(m[1]) : 0; };
function filterSkills(list) {
  let out = list;
  if (!$('#skmisc').checked)   out = out.filter(x => !isMisc(x));
  if (!$('#sklevels').checked) {
    const best = new Map();
    for (const x of out) {
      const b = baseName(x.name) || String(x.id);
      const cur = best.get(b);
      if (!cur || rankOf(x.name) > rankOf(cur.name)) best.set(b, x);
    }
    out = [...best.values()];
  }
  return out;
}

// Shared HTML escaper — tooltips carry client Descript text straight from the SHN.
const esc = t => String(t == null ? '' : t).replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));

// BUFF/DEBUFF BAR (operator 2026-08-13): the client's own abstate icons at half tile size, above the
// skills. Name + description on hover. An abstate with no art still shows a chip with its id, because
// "we are buffed with something we cannot name" is information, not something to hide.
function abStateBar(list, live) {
  const el = $('#abstates');
  if (!el) return;
  const chips = (list || []).map(a => {
    const tip = [a.name || `abstate ${a.id}`, a.descript].filter(Boolean).join(' — ');
    return `<div class="abchip" title="${esc(tip)}">`
      + (a.hasIcon ? `<img src="/abstateicon/${a.id}.png" alt="" onerror="this.remove()">`
                   : `<span class="ab">${a.id}</span>`)
      + '</div>';
  });
  // MOUNT STATE beside the buffs (operator 2026-08-13). It belongs here because it behaves like one: a
  // state you are IN that changes what you can do. Always shown, mounted or not, because "not mounted" is
  // the answer to a question you are asking when you look, not an absence to hide.
  // ⛔ RIDING IS NOT CANCELLED BY DAMAGE — CASTING THE MOUNT SKILL IS (operator 2026-08-13, correcting
  // me). Once you are up, being hit does not dismount you; what damage interrupts is the SUMMON CAST, so
  // a bot trying to mount while something is hitting it never gets on. That is the failure we already
  // measured (the summon refused 0/21 while taking damage, and cancelled our walk each time) — the cost
  // is entirely in mounting, not in staying mounted.
  // ⛔ ONE SOURCE, AND IT IS THE STREAM WHEN THE STREAM IS UP. This chip read the /metrics poll while the
  // combat map read the stream — two reads taken at different instants, so a mount that happened between
  // them showed a walking character on a mounted map (or the reverse) with no symptom but a wrong picture.
  // Prefer the streamed self, which is the same value the marker is being interpolated with.
  const streamSelf = (evAlive && lastEnt && lastEnt.self) ? lastEnt.self : null;
  const src = streamSelf || live;
  if (src) {
    const on = !!src.mounted;
    chips.unshift(`<div class="abchip mount${on ? ' on' : ''}" title="${on ? 'MOUNTED' : 'on foot'}">`
      + `<span class="ab">${on ? '🐎' : '👣'}</span></div>`);
  }
  el.innerHTML = chips.join('');
}

// SOUL STONES AS TILES (operator 2026-08-13: "display current stone cooldown as a skill-icon-sized
// 'button' basically exactly like skills"). Same markup and the same cooldown sweep the skill tiles use,
// so a stone reads at a glance the way a skill does. A stone with no measured cooldown renders as the
// existing dashed "cd unknown" tile rather than inventing a number (SP's gap has never been measured).
function stoneTiles(list) {
  const el = $('#stones');
  if (!el) return;
  if (!list || !list.length) { el.innerHTML = ''; return; }
  el.innerHTML = list.map(s => {
    const cd = s.cooldownMs || 0, rem = s.remainingMs;
    const label = s.kind === 'hp' ? 'HP' : 'SP';
    const tip = [`${label} soul stone`, `${s.count} left${s.max ? ` of ${s.max}` : ''}`,
                 cd ? `cd ${(cd/1000).toFixed(1)}s` : 'cd unknown (never measured for this stone)',
                 s.depleted ? 'DEPLETED' : null].filter(Boolean).join(' — ');
    if (s.depleted || !s.count)
      return `<div class="tile stone out" title="${esc(tip)}"><span class="nm">${label}</span>
                <span class="cd">0</span></div>`;
    if (!cd) return `<div class="tile stone unk" title="${esc(tip)}"><span class="nm">${label}</span>
                       <span class="cd">${s.count}</span></div>`;
    const cooling = rem != null && rem > 0;
    const frac = cooling ? Math.max(0, Math.min(1, rem / cd)) : 0;
    const sweep = cooling
      ? `<div class="sweep" style="background:conic-gradient(rgba(0,0,0,.72) ${frac*360}deg, rgba(0,0,0,0) 0)"></div>` : '';
    return `<div class="tile stone ${cooling?'cool':'ready'}" data-cd="stone:${s.kind}" title="${esc(tip)}">
              <span class="nm">${label}</span>${sweep}
              <span class="cd">${cooling ? (rem/1000).toFixed(1) : s.count}</span></div>`;
  }).join('');
}

function skillTiles(all) {
  if (!all || !all.length) { $('#skills').innerHTML = '<span class="muted">no skills</span>'; return; }
  const list = filterSkills(all);
  const hidden = all.length - list.length;
  $('#skhint').textContent = `· ${list.length} shown${hidden ? ` (${hidden} filtered)` : ''} · lit = ready, dashed = cd unknown`;
  $('#skills').innerHTML = list.map(s => {
    const cd = s.cooldownMs || 0, rem = s.remainingMs;
    // Art when the client has it, name text when it does not — never a blank tile.
    const art = s.hasIcon ? `<img src="/skillicon/${s.id}.png" alt="" onerror="this.remove()">` : '';
    const tip = [s.name||s.id, s.descript, s.spCost!=null?`sp ${s.spCost}`:null,
                 s.damage!=null?`dmg ${s.damage}`:null, cd?`cd ${(cd/1000).toFixed(1)}s`:'cd unknown']
                .filter(Boolean).join(' — ');
    if (!cd) return `<div class="tile unk" title="${esc(tip)}">${art}
                       ${art?'':`<span class="nm">${s.name || s.id}</span>`}</div>`;
    const cooling = rem != null && rem > 0;
    // Sweep covers the fraction of the cooldown STILL TO RUN, so the tile visibly empties as it comes up.
    const frac = cooling ? Math.max(0, Math.min(1, rem / cd)) : 0;
    const sweep = cooling
      ? `<div class="sweep" style="background:conic-gradient(rgba(0,0,0,.72) ${frac*360}deg, rgba(0,0,0,0) 0)"></div>` : '';
    return `<div class="tile ${cooling?'cool':'ready'}" data-cd="skill:${s.id}" title="${esc(tip)}">
              ${art}${sweep}${art?'':`<span class="nm">${s.name || s.id}</span>`}
              ${cooling ? `<span class="cd">${(rem/1000).toFixed(1)}</span>` : ''}</div>`;
  }).join('');
}

// Character sheet: fixed stats + passives, together, per the layout spec. Every value here is either
// from the wire (CHAR_PARAMETER_DATA at zone-entry) or client data — nothing derived or guessed, and a
// missing block renders as "not known" rather than zeros.
function charSheet(l) {
  const st = l.stats;
  const stats = !st ? '<div class="muted">stats not known (no CHAR_PARAMETER_DATA this login)</div>' : `
    <div class="kv">
      <div>STR / END</div><div>${num(st.str)} / ${num(st.end)}${l.freeStatPoints ? ` <span class="hit-warn">+${l.freeStatPoints} unspent</span>` : ''}</div>
      <div>DEX / INT / SPR</div><div>${num(st.dex)} / ${num(st.int)} / ${num(st.spr)}</div>
      <div>attack</div><div>${num(st.dmgMin)}~${num(st.dmgMax)} <span class="muted">m.dmg ${num(st.magicDmg)}</span></div>
      <div>defence</div><div>DEF ${num(st.def)} · M.DEF ${num(st.magicDef)}</div>
      <div>aim / evasion</div><div>${num(st.aim)} / ${num(st.evasion)}</div>
      <div>facing</div><div>${l.facing != null ? l.facing.toFixed(0)+'°' : '<span class="muted">none set</span>'}</div>
      <div>target</div><div id="tgtcell"><span class="muted">—</span></div>
      <div>level exp</div><div>${expBandText(l)}</div>
    </div>`;
  const ps = l.passives;
  const passives = !ps || !ps.length ? '<div class="muted">none</div>'
    : ps.map(p => `<div>${p.name || ('passive '+p.id)}</div>`).join('');
  return `${stats}<h2 style="margin-top:10px">passives</h2>${passives}`;
}

function metricsTable(ms) {
  // Percentiles follow each metric's direction: for HigherIsBetter the LOW tail is the warning sign,
  // for LowerIsBetter the HIGH tail is. The server already picks the right end; we just label it.
  const wins = ms[0]?.windows?.map(w => w.window) ?? [];
  $('#mwin').textContent = wins.length ? `· windows ${wins.join(' / ')} · p95/p99 = worst-case tail for that metric` : '';
  let h = '<tr><th>metric</th><th>now</th>';
  for (const w of wins) h += `<th>${w} avg</th><th>${w} p95</th><th>${w} sum</th>`;
  h += '</tr>';
  for (const m of ms) {
    h += `<tr><td title="${m.direction} · ${m.kind}">${m.name}</td><td>${num(m.latest)}</td>`;
    for (const w of m.windows) h += `<td>${num(w.avg)}</td><td>${num(w.p95)}</td><td>${num(w.sum)}</td>`;
    h += '</tr>';
  }
  return h;
}

// ── heatmap (rendered client-side from raw points, per the epic) ──────────────────────────────────
// ⭐ "(current)" MEANS THE CURRENT MAP — it used to mean NO FILTER, which overlaid every map the bot has
// ever walked into one canvas: the bounding box spanned all of them at once, so the shapes sat on top of
// each other and the legend counted four maps ("EldCem01:45 Eld:61 RouCos03:84 RouVal02:48") while the
// option said "(current)". Resolve it to the map the bot is standing on (lastLive.map) so the default
// view is one map, and follow the bot when it changes map.
function selectedMap() {
  const v = $('#mapsel').value;
  return v || (lastLive && lastLive.map) || null;
}
let pts = [], sinceT = 0, lastMap = null;
// THE MAP HEADER, in one place. It was previously written from three call sites in three slightly different
// formats, which is how it ended up stuck showing a stale map: whichever path fired last won. Everything now
// renders through here, and it adds the destination while a cross-map journey is running, because "where is it
// and where is it going" is one question.
function setMapHeader(code, display, travelCode, travelDisplay) {
  if (!code) { $("#mapname").textContent = ""; return; }
  let t = display ? `· ${display} (${code})` : `· ${code}`;
  if (travelCode && travelCode !== code) {
    t += travelDisplay ? ` — travelling to ${travelDisplay} (${travelCode})` : ` — travelling to ${travelCode}`;
  }
  $("#mapname").textContent = t;
}
// (bigMapDirty/bigMapUrgent/lastBigDraw moved up beside mmCache -- minimap()'s load callbacks now set them, and
// minimap() is defined above this point. Same TDZ reasoning as before, one step further up.)
let serverSkewMs = 0;                       // serverNow - clientNow, learned on each /trace poll
const serverNow = () => Date.now() + serverSkewMs;
async function tickTrace() {
  try {
    const map = selectedMap() || undefined;
    if (map !== lastMap) { pts = []; sinceT = 0; lastMap = map; }   // map switch = fresh canvas
    const r = await api('/trace', { since: sinceT, map, recent: $('#recent').checked });
    if (!r.ok) return;
    const d = await r.json();
    for (const p of d.points) { pts.push(p); if (p.t > sinceT) sinceT = p.t; }
    if (pts.length > 20000) pts = pts.slice(-20000);
    // ONE CLOCK FOR ALL TRACE POINTS. Poll points are stamped with SERVER time; points appended from the stream can
    // only see the browser's. Mixing them makes the age-based fade wrong for whichever set is on the other clock, by
    // exactly the clock difference. The poll is the one place both are visible at once, so learn the offset here.
    serverSkewMs = d.nowUnixMs - Date.now();
    bigMapDirty = true;          // the render loop owns the repaint now; the poll just supplies history          // the render loop owns the repaint now; the poll just supplies history
  } catch {}
}

function draw(now) {
  const c = $('#heat'), g = c.getContext('2d');
  const W = c.width, H = c.height;
  g.clearRect(0,0,W,H);
  // Always filter to ONE map. Mixing maps in a single bounding box is not a heatmap, it is a collage.
  const mapKey = selectedMap();
  const shown = mapKey ? pts.filter(p=>p.map===mapKey) : pts;
  // ── VIEWPORT: THE NPC RECTANGLE, NOT THE TRACE ────────────────────────────────────────────────
  // Operator 2026-08-13: "start not with a single point but instead a rectangle encompassing ALL npcs
  // loaded on login burst." Framing on the trace made the view meaningless early — one point is a
  // zero-area box, so the first samples filled the canvas at absurd zoom and the frame lurched with
  // every step. The map-enter NPC seed is the whole map's NPC roster, so its bbox is a stable frame
  // that means something from the first paint. The trace is then drawn INSIDE that frame, and the box
  // is only extended if the bot walks outside it.
  const drawnMap = mapKey || (lastLive && lastLive.map);
  const npcs = (lastEnt && lastEnt.map === drawnMap ? (lastEnt.npcs||[]) : []);
  // ⭐ THE BIG MAP IS THE WHOLE MINIMAP, 1:1, AND NEVER ZOOMS (operator 2026-08-13: "make the big map a
  // 1:1 of the whole minimap so it fills it fully and never zooms"). Fitting the view to content — first
  // the trace, then the NPC bbox — made the scale change under the operator as the bot moved, which is
  // what read as "scaled"/misaligned: the art was correct but its frame kept moving. A FIXED frame of the
  // full world extent is both stable and directly comparable to the game's own map.
  const mm = minimap(drawnMap);
  let x0, y0, x1, y1;
  if (mm && mm.meta && mm.meta.coverX1 > mm.meta.coverX0) {
    // Frame on what the ART covers, so 1:1 means the image exactly fills the canvas.
    x0 = mm.meta.coverX0; y0 = mm.meta.coverY0; x1 = mm.meta.coverX1; y1 = mm.meta.coverY1;
  } else {
    // No extent known (no grid / no art): fall back to framing the content so the panel still works.
    x0=1e9; y0=1e9; x1=-1e9; y1=-1e9;
    for (const n of npcs) { if(n.x<x0)x0=n.x; if(n.x>x1)x1=n.x; if(n.y<y0)y0=n.y; if(n.y>y1)y1=n.y; }
    for (const p of shown) { if(p.x<x0)x0=p.x; if(p.x>x1)x1=p.x; if(p.y<y0)y0=p.y; if(p.y>y1)y1=p.y; }
    if (x1 < x0) { g.fillStyle='#30363d'; g.fillText('no trace or NPC seed yet', 10, 20); return; }
    const cxw = (x0+x1)/2, cyw = (y0+y1)/2, half = Math.max((x1-x0), (y1-y0), 1)/2 * 1.06;
    x0 = cxw-half; x1 = cxw+half; y0 = cyw-half; y1 = cyw+half;
  }
  // No inset in full-extent mode: "fills it fully" means edge to edge, not an 8px letterbox.
  const pad = (mm && mm.meta && mm.meta.worldWidth) ? 0 : 8;
  const sxs = (x1-x0)||1, sys = (y1-y0)||1, s = Math.min((W-2*pad)/sxs, (H-2*pad)/sys);
  const px = p => pad + (p.x-x0)*s, py = p => H - (pad + (p.y-y0)*s);   // flip Y: game +Y is up
  // The client's own art, framed on the same world rect the points project into: world x0 lands at
  // px=pad and world y0 at py=H-pad, so the destination is that same inset box.
  drawMinimapInto(g, mapKey || (lastLive && lastLive.map), x0, y0, x1, y1,
                  pad, H - pad - sys*s, sxs*s, sys*s, 0.85);
  // Age-based decay is applied HERE, in the browser, so the server never has to pick a curve and the
  // same raw points can be re-rendered with different decay without refetching.
  const span = 30*60*1000;
  for (const p of shown) {
    const age = Math.min(1, (now - p.t) / span);
    g.fillStyle = `rgba(${Math.round(88+167*(1-age))},${Math.round(166-60*age)},${Math.round(255-140*age)},${0.15+0.55*(1-age)})`;
    g.fillRect(px(p)-1.5, py(p)-1.5, 3, 3);
  }
  // NPC markers + name tags on the big map too (operator 2026-08-13), so the frame is readable as a
  // PLACE — "the bot is by the Smith" — rather than as an abstract cloud of dots.
  for (const n of npcs) drawNpcMarker(g, px(n), py(n), n.name, n.isGate, n.linkMap);
  if (shown.length) {
    const last = shown[shown.length-1];
    g.fillStyle = '#f85149'; g.beginPath(); g.arc(px(last), py(last), 3.5, 0, 7); g.fill();
  }
  g.fillStyle = '#7d8590'; g.textAlign = 'left'; g.textBaseline = 'alphabetic';
  g.fillText(`${shown.length} pts · ${npcs.length} npc · x ${x0.toFixed(0)}-${x1.toFixed(0)}  y ${y0.toFixed(0)}-${y1.toFixed(0)}`, 6, H-6);
}

// ── log with severity filter ──────────────────────────────────────────────────────────────────────
async function tickLog() {
  try {
    const r = await api('/log', { level: $('#lvl').value, max: 400 });
    if (!r.ok) return;
    const txt = await r.text();
    const el = $('#log');
    const atBottom = el.scrollTop + el.clientHeight >= el.scrollHeight - 30;
    el.innerHTML = txt.trimEnd().split('\n').map(line => {
      let cls = 'l-verb';
      if (/ N /.test(line.slice(12,16))) cls = 'l-note';
      else if (/ I /.test(line.slice(12,16))) cls = 'l-info';
      let h = line.replace(/[&<>]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[ch]));
      h = h.replace(/CRUTCH\[CRIT\]/g,'<span class="hit-crit">CRUTCH[CRIT]</span>')
           .replace(/CRUTCH\[WARN\]/g,'<span class="hit-warn">CRUTCH[WARN]</span>')
           .replace(/CRUTCH\[OK\]/g,'<span class="hit-ok">CRUTCH[OK]</span>')
           .replace(/\bDIED\b|\bDEATH\b/g,'<span class="hit-crit">$&</span>');
      return `<div class="${cls}">${h}</div>`;
    }).join('');
    // Hold position when the operator is reading back through the log. The checkbox sits in the card
    // header, so its click must not also toggle the fold — hence stopPropagation on the label.
    if (atBottom && !$('#noscroll').checked) el.scrollTop = el.scrollHeight;
    scanEvents(txt);
  } catch {}
}

$('#mapsel').onchange = () => { pts=[]; sinceT=0; };
$('#recent').onchange = () => { pts=[]; sinceT=0; };
const saved = localStorage.getItem('botwatch.tok'); if (saved) $('#tok').value = saved;
$('#tok').onchange = () => localStorage.setItem('botwatch.tok', $('#tok').value);

// ── bot picker ────────────────────────────────────────────────────────────────────────────────────
// Populated from GET /api/bots and refreshed, so a bot spawned (or lost) while the page is open shows up
// without a reload. The chosen bot persists in localStorage — reopening the page returns to the one you
// were watching rather than whichever id happens to sort first.
// Rebuild only when the SET of bots changes: replacing the options every poll would slam an open
// dropdown shut while the operator is choosing from it.
let botListKey = '';
async function tickBots() {
  try {
    const u = new URL('/api/bots', location.origin);
    const tok = $('#tok').value.trim();
    const r = await fetch(u, { headers: tok ? { Authorization:'Bearer '+tok } : {} });
    if (!r.ok) return;
    const bots = await r.json();
    // Label with the state that decides whether the panels will have anything in them, so a bot that
    // died or never entered a zone is obvious IN THE PICKER instead of looking like empty panels.
    // The selected bot is part of the key: while it is away the list itself may not change, but the
    // "— reconnecting…" entry has to be rebuilt (and removed again on its return), so the early-out
    // must notice that too.
    const key = bots.map(b => `${b.id}:${b.phase}:${b.level ?? ''}`).join('|') + '#' + ($('#bot').value || '');
    if (key === botListKey) return;
    botListKey = key;
    const sel = $('#bot');
    const want = sel.value || localStorage.getItem('botwatch.bot') || (bots[0] && bots[0].id) || '';
    let html = bots.map(b => {
      const lvl = b.level ? ` L${b.level}` : '';
      const bad = b.phase !== 'InZone' ? ` — ${b.phase}` : '';
      return `<option value="${b.id}"${b.id === want ? ' selected' : ''}>${b.id}${lvl}${bad}</option>`;
    }).join('');
    // ⛔ DO NOT SWITCH BOTS BEHIND THE OPERATOR'S BACK. This used to fall back to bots[0] whenever the
    // selected bot was missing from the list — and a bot goes missing for a few seconds on every RELOG
    // and every cross-server zone change, because StopAsync removes the handle before Spawn re-adds it
    // (the 404 window tracked as a P0). So watching a bot through a map change silently moved you to a
    // different bot, and it never moved back: next refresh `want` read the NEW selection as the wanted
    // one. Operator 2026-08-11: "the UI sometimes randomly swaps which bot is being watched (maybe on
    // zone change?)" — exactly that.
    // Keep the chosen bot selected and say it is reconnecting. Only a real click changes bots.
    if (want && !bots.some(b => b.id === want))
      html += `<option value="${want}" selected>${want} — reconnecting…</option>`;
    sel.innerHTML = html;
    sel.value = want;
  } catch {}
}
$('#bot').onchange = () => {
  localStorage.setItem('botwatch.bot', $('#bot').value);
  // Everything on the page belongs to ONE bot. Switching without clearing leaves the previous bot's
  // trace, quests and toasts on screen under the new bot's name — which is worse than a blank panel.
  pts = []; sinceT = 0; lastMap = null; lastLive = null; lastEnt = null; questList = []; questsById = new Map();
  tickMetrics(); tickTrace(); tickLog(); tickCombat();
};
// ── ITEMS ────────────────────────────────────────────────────────────────────────────────────────
// Icons come from /icon/<itemId>.png — the client's own atlas, cut server-side. That route is
// deliberately outside /api because an <img> cannot send the bearer token, and item art is not
// sensitive. onerror swaps the tile to the item NAME, which is the same thing a host with no icon
// dir shows, so the panel degrades to something readable instead of broken images.
function islot(it, extra) {
  if (!it) return '<div class="islot empty"></div>';
  const nm = (it.name || ('item' + it.itemId)).replace(/"/g, '&quot;');
  const cnt = (it.count != null && it.count > 1) ? `<span class="ct">${it.count}</span>` : '';
  return `<div class="islot" title="${nm} (id ${it.itemId}${it.count!=null?', x'+it.count:''})">`
       + `<img src="/icon/${it.itemId}.png" alt=""`
       + ` onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'nm',textContent:${JSON.stringify(nm)}}))">`
       + `${cnt}${extra||''}</div>`;
}
async function tickItems() {
  try {
    const [ri, re] = await Promise.all([api('/inventory'), api('/equipment')]);
    if (ri.ok) {
      const d = await ri.json();
      const items = d.items || [];
      // Draw the bag at its real capacity so "how full is it" is visible at a glance — an empty
      // slot is a slot, not a gap. Slots are sparse in the payload, so index them by slot number.
      const bySlot = {}; for (const it of items) bySlot[it.slot] = it;
      const cap = d.capacity || items.length;
      const lo = Math.min(...Object.keys(bySlot).map(Number), 0);
      const keys = Object.keys(bySlot).map(Number).sort((a,b)=>a-b);
      const base = keys.length ? Math.min(...keys) : 0;
      // PAGES OF 24 (6 wide x 4 high), like the client's bag. Two pages is the whole bag today; the
      // page count follows capacity so it stays right if the bag grows, and is capped at 2 for now.
      const PAGE = 24, pages = Math.max(1, Math.min(2, Math.ceil(cap / PAGE)));
      let html = '';
      for (let p = 0; p < pages; p++) {
        html += '<div class="ipage">';
        for (let i = 0; i < PAGE; i++) html += islot(bySlot[base + p*PAGE + i]);
        html += '</div>';
      }
      $('#bag').innerHTML = html;
      $('#bagcap').textContent = `${d.used||items.length}/${cap}`;
      $('#ihint').textContent = `${d.used||items.length} carried`;
    }
    if (re.ok) {
      const d = await re.json();
      const worn = d.worn || [];
      $('#worn').innerHTML = worn.length
        ? worn.map(w => islot({ itemId: w.itemId, name: w.name, count: null },
                              `<span class="eq">${w.equipSlot}</span>`)).join('')
        : '<span class="muted">nothing worn</span>';
    }
  } catch (e) { /* transient: the bot may be between sessions */ }
}
setInterval(tickItems, 4000); tickItems();
