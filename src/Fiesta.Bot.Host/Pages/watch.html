// ── card folding (persisted) ──────────────────────────────────────────────────────────────────────
// Default OPEN; only an explicit collapse is remembered, so a new card added later shows up rather
// than being hidden by a stale preference.
function applyFold(h) {
  const card = h.dataset.card, panel = h.closest('.panel');
  if (localStorage.getItem('fold:' + card) === 'closed') panel.classList.add('closed');
  h.onclick = () => {
    const closed = panel.classList.toggle('closed');
    localStorage.setItem('fold:' + card, closed ? 'closed' : 'open');
  };
}
document.querySelectorAll('h2.fold').forEach(applyFold);

// ── token + bot id persistence ────────────────────────────────────────────────────────────────────
// The bearer token is kept in localStorage so a reload doesn't mean re-pasting it. It is a
// browser-local convenience on an already-authenticated view, not a new place secrets travel.
for (const [el, key] of [[$('#tok'), 'watch:tok'], [$('#bot'), 'watch:bot']]) {
  const saved = localStorage.getItem(key);
  if (saved) el.value = saved;
  el.addEventListener('change', () => localStorage.setItem(key, el.value));
  el.addEventListener('blur',   () => localStorage.setItem(key, el.value));
}
if (localStorage.getItem('watch:noscroll') === '1') $('#noscroll').checked = true;
$('#noscroll').addEventListener('change', e => localStorage.setItem('watch:noscroll', e.target.checked ? '1' : '0'));
$('#skmisc').addEventListener('change', () => lastLive && skillTiles(lastLive.skills));
$('#sklevels').addEventListener('change', () => lastLive && skillTiles(lastLive.skills));
// Combat-map zoom: persisted like the other view settings, and applied to CM_RANGE. Redraw is left to
// the 5/sec tick rather than forced here — one frame of latency is imperceptible and it keeps a single
// draw path, so the selector cannot drift from what the tick renders.
{
  const z = $('#cmzoom'), saved = localStorage.getItem('watch:cmzoom');
  if (saved) z.value = saved;
  CM_RANGE = Number(z.value);
  z.addEventListener('change', () => { CM_RANGE = Number(z.value); localStorage.setItem('watch:cmzoom', z.value); });
}

// ── combat map: LIVE over a WebSocket, polling only as the fallback ───────────────────────────────
// Operator 2026-08-13: "Each entity is updated when new info is received, instead of all in one go every
// second or whatever." The 5/sec poll re-read every entity each time, so a mob that had just moved looked
// identical to one that had not moved in a minute and the map could never be sharper than the poll.
// /stream pushes one JSON message per change: `hello` is a whole /entities-shaped snapshot, then `entity`
// / `gone` / `self` patch it in place. Same object, same draw path — see the endpoint's doc for why the
// shape is deliberately shared rather than bespoke.
let evSock = null, evBot = null, evMaxHp = 0, evAlive = false;

// ⛔ EVERYTHING THE MAP DRAWS COMES OFF THE WIRE — including the NPC layer. The first version streamed
// only mobs and sent the NPC seed exclusively inside `hello`, so a map change left the page holding the
// previous map's NPCs and its background art, and the JCQ clone never appeared at all. Both were the same
// mistake: treating a real packet as if it were only pollable. Operator: "every map change sends a login
// burst with new char info, this packet can be streamed." It is now, entity by entity, so a new map
// rebuilds its whole picture from the burst exactly like the game client does.
function applyStream(msg) {
  // `hello` (stream open) and `state` (map change) are the SAME full-state packet — the stream is
  // self-sufficient by design, so there is exactly one code path that installs a whole picture.
  if (msg.t === 'hello' || msg.t === 'state') {
    lastEnt = msg.entities; evMaxHp = msg.maxHp || 0;
    anim.clear();
    for (const m of lastEnt.mobs || []) noteMove(m);
    // ⛔ SEED SELF FROM THE OPENING STATE. Waiting for the first `self` delta is not safe: a delta is only
    // sent when the state CHANGES, so a bot standing still — mounted, at 203 u/s — never produces one, and
    // the marker would sit unanimated on a stale position for as long as it stayed put.
    selfAnim = null; lastSelfAt = 0;
    if (lastEnt.self) noteSelfMove(lastEnt.self, null);
    setMapHeader(lastEnt.map, msg.mapDisplay,
                 lastEnt.self && lastEnt.self.travelTo, lastEnt.self && lastEnt.self.travelToDisplay);
  } else if (!lastEnt) {
    return;                       // a delta before hello describes a picture we do not have yet
  } else if (msg.t === 'entity') {
    const m = lastEnt.mobs || (lastEnt.mobs = []);
    const i = m.findIndex(x => x.handle === msg.e.handle);
    if (i >= 0) m[i] = msg.e; else m.push(msg.e);
    noteMove(msg.e);
  } else if (msg.t === 'npc') {
    // Keyed by handle when it has one, else by mob id + position — a seed entry has no handle because it
    // outlives the live sighting on purpose (the seed covers the whole map, not just what is in AoI).
    const key = e => e.handle != null ? `h${e.handle}` : `m${e.mobId}@${Math.round(e.x)},${Math.round(e.y)}`;
    const list = lastEnt.npcs || (lastEnt.npcs = []);
    const k = key(msg.e);
    const i = list.findIndex(x => key(x) === k);
    if (i >= 0) list[i] = msg.e; else list.push(msg.e);
  } else if (msg.t === 'gone') {
    // ⛔ MOBS ONLY. An NPC leaving AoI must NOT erase its marker: the seed is the whole-map roster and the
    // real client keeps showing those markers whether or not you are standing next to them. Only a map
    // change clears the NPC layer.
    if (lastEnt.mobs) lastEnt.mobs = lastEnt.mobs.filter(x => x.handle !== msg.handle);
    anim.delete(msg.handle);
  } else if (msg.t === 'self') {
    noteSelfMove(msg.self, lastEnt.self);
    lastEnt.self = msg.self;
    // SELF-HEAL THE MAP. The map used to arrive only as a one-shot 'map' event, so a single missed or
    // overwritten update left this page on the wrong map forever: the combat canvas kept drawing the old
    // art and every NPC vanished, because the npc list is gated on lastEnt.map === drawnMap. self is
    // re-sent whenever it changes and now carries the map, so a disagreement corrects itself here.
    if (msg.self && msg.self.map && msg.self.map !== lastEnt.map) {
      lastEnt.map = msg.self.map; lastEnt.mobs = []; lastEnt.npcs = []; anim.clear();
    }
    // THE MAP HEADER, from the self sample. It carries both halves — the code and the display name — so the header
    // renders fully without waiting for a poll or for the next one-shot map event.
    // Keep the toggle honest: the bot is the authority on whether it is narrating, not this page. This also makes
    // the button correct after a reconnect, where the setting used to silently revert without the UI noticing.
    if (msg.self && msg.self.announcing !== undefined && msg.self.announcing !== announcing) {
      paintAnnounce(!!msg.self.announcing);
    }
    if (msg.self && msg.self.map) {
      setMapHeader(msg.self.map, msg.self.mapDisplay, msg.self.travelTo, msg.self.travelToDisplay);
    }
    // THE BIG MAP'S TRACE, from the same sample. The path used to advance only when the 1s /trace poll landed, so a
    // bot moving at 200 u/s drew a line of 200-unit steps. Appending here draws it at the rate the server actually
    // reports us moving. The poll still owns HISTORY (everything from before this page opened) and the trimming
    // rule below is the same one it uses.
    if (msg.self && msg.self.x != null && lastEnt.map) {
      const mk = selectedMap();
      if (!mk || mk === lastEnt.map) {
        pts.push({ x: msg.self.x, y: msg.self.y, map: lastEnt.map, t: serverNow() });
        bigMapDirty = true;
        if (pts.length > 20000) pts = pts.slice(-20000);
      }
    }
  } else if (msg.t === 'hp' || msg.t === 'sp') {
    // VITALS FROM THE PACKET, not from the 2-second /metrics poll. HPCHANGE/SPCHANGE already arrive on the wire and
    // the handle already republishes them; the stream simply never forwarded them. At 14 ticks/sec a 2s poll can miss
    // an entire fight. lastLive stays the authority for the rest of that panel -- only the numbers the event actually
    // carries are patched, and the next poll reconciles everything else.
    if (lastLive) {
      if (msg.t === 'hp') { lastLive.hp = msg.hp; if (msg.maxHp) lastLive.maxHp = msg.maxHp; }
      else { lastLive.sp = msg.sp; if (msg.maxSp) lastLive.maxSp = msg.maxSp; }
      $('#vitals').innerHTML = vitals(lastLive);
    }
    if (lastEnt && lastEnt.self) {
      if (msg.t === 'hp') { lastEnt.self.hp = msg.hp; if (msg.maxHp) lastEnt.self.maxHp = msg.maxHp; }
      else { lastEnt.self.sp = msg.sp; if (msg.maxSp) lastEnt.self.maxSp = msg.maxSp; }
    }
  } else if (msg.t === 'stones') {
    // Reserve counts and stone cooldowns, straight off the buy-ack / use / zone-enter seed. Same payload shape the
    // /metrics poll builds, so the renderer is reused as-is.
    if (lastLive) lastLive.stones = msg.stones;
    stoneTiles(msg.stones);
  } else if (msg.t === 'exp' || msg.t === 'money') {
    if (lastLive) {
      if (msg.t === 'exp') lastLive.exp = msg.exp; else lastLive.money = msg.money;
      $('#vitals').innerHTML = vitals(lastLive);
    }
  } else if (msg.t === 'levelup') {
    // A level-up invalidates most of the panel at once — stats, exp band, what is deprioritized — so the host
    // resends full state alongside this; just announce it and let that land.
    if (lastLive) { lastLive.level = msg.level; $('#vitals').innerHTML = vitals(lastLive); }
    $('#skhint').textContent = `· LEVEL ${msg.level}`;
    tickMetrics();
  } else if (msg.t === 'skillcast') {
    // The server CONFIRMED this cast started (0x244E), which is the instant its cooldown begins. Start the tile's
    // sweep from here rather than from whenever the next poll happens to land -- the poll then reconciles it.
    if (lastLive && lastLive.skills) {
      const sk = lastLive.skills.find(x => x.id === msg.skillId);
      if (sk && sk.cooldownMs) { sk.remainingMs = sk.cooldownMs; sk.castAt = Date.now(); skillTiles(lastLive.skills); }
    }
  } else if (msg.t === 'skilllearn') {
    // A learn changes what the bot CAN DO, so it should not wait up to 2s to appear. The event names the skill, so
    // there is no list-diffing; refresh the panel immediately and let the poll fill in the full record.
    $('#skhint').textContent = `· learned ${msg.passive ? 'passive' : 'skill'} ${msg.name || ('#' + msg.skillId)}`
                             + (msg.level ? ` lv${msg.level}` : '') + ' — refreshing';
    tickMetrics();
  } else if (msg.t === 'map') {
    // Every handle we hold belongs to the old map, and so do the NPC markers and the background art. Clear
    // and let the login burst refill it — the map NAME comes from the handoff itself, so the art switches
    // on this message rather than waiting for anything.
    lastEnt.map = msg.map; lastEnt.mobs = []; lastEnt.npcs = []; anim.clear();
    bigMapDirty = true; bigMapUrgent = true;   // the big map's art and markers just became wrong -- repaint NOW
    if (lastEnt.self && msg.x != null) { lastEnt.self.x = msg.x; lastEnt.self.y = msg.y; selfAnim = null; }
    setMapHeader(msg.map, msg.mapDisplay,
                 lastEnt.self && lastEnt.self.travelTo, lastEnt.self && lastEnt.self.travelToDisplay);
  } else return;                  // hit / chat / castfail / movefail — narration, not map state
}

function connectStream() {
  const who = $('#bot').value, tok = $('#tok').value.trim();
  if (!who) return;
  if (evSock && evBot === who && (evSock.readyState === 0 || evSock.readyState === 1)) return;
  try { evSock && evSock.close(); } catch {}
  evBot = who; evAlive = false;
  const url = new URL(`/api/bots/${encodeURIComponent(who)}/stream`, location.origin);
  url.protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
  // A browser cannot set a header on a WebSocket, so the token rides in the SUBPROTOCOL list and the
  // server selects the 'bearer' marker back. Without a token, connect plain (a host with no
  // BOT_API_TOKEN is open, which is the local dev case).
  const sock = tok ? new WebSocket(url, ['bearer', tok]) : new WebSocket(url);
  evSock = sock;
  sock.onmessage = e => { evAlive = true; try { applyStream(JSON.parse(e.data)); } catch {} };
  sock.onclose = () => { if (evSock === sock) { evSock = null; evAlive = false; } };
  sock.onerror = () => { try { sock.close(); } catch {} };
}

// ── CLIENT-SIDE POSITION INTERPOLATION (operator 2026-08-13) ──────────────────────────────────────
// "track timestamp of a move command, smoothly interpolate to it with movespeed".
// An entity's x/y on the wire is its move DESTINATION, not where it is standing: the server says "this
// mob is walking from A to B at S u/s" and the entity spends distance/S seconds getting there. Drawing
// the destination teleports it and then freezes it until the next packet — the opposite of what the
// game shows. The move block carries fromX/fromY/toX/toY/speed plus an AGE in ms (not a timestamp: the
// browser clock is not the server's, and the skew would offset every entity by hundreds of units at
// 120 u/s), so we can place it exactly where it should be right now and keep walking it from there.
// MEASURED: segment length / time-to-next-move-packet = 110-122 u/s against a predicted 120.0, i.e. the
// next packet lands just as the entity arrives — so this reproduces the real motion, it does not guess it.
const anim = new Map();           // handle -> {fx, fy, tx, ty, spd, t0}  (t0 = local ms when the move began)

// ⛔ SNAP WHEN THE SERVER'S START POSITION DISAGREES WITH OURS (operator 2026-08-13). Interpolation is a
// PREDICTION, and a prediction that has drifted must be abandoned, not eased away from: if the new
// segment starts somewhere we are not drawing the entity, our picture is simply wrong — it was teleported,
// warped, or we missed packets — and sliding it across to catch up shows a journey that never happened.
// The threshold is DERIVED, not a magic number: anything further than the entity could physically have
// travelled since we last heard about it (plus a margin for packet jitter) is not movement, it is a
// correction. Inside that, we ease so ordinary jitter does not make everything twitch.
// SELF ONLY. Entities need no threshold — they are placed straight from the packet (see noteMove), so
// they are already exactly where the server says. Self is SAMPLED, with no from/to to chain, so easing
// between samples is what makes it move at all — and easing is wrong across a teleport.
const SNAP_MARGIN_U = 60;         // packet-timing slack, in world units

function snapNeeded(cur, fromX, fromY, spd, sinceMs) {
  if (!cur) return true;                                  // nothing drawn yet — just place it
  const couldTravel = Math.max(0, spd) * (Math.max(0, sinceMs) / 1000) + SNAP_MARGIN_U;
  return Math.hypot(fromX - cur.x, fromY - cur.y) > couldTravel;
}

// ⛔ AN ENTITY IS PLACED PURELY FROM THE PACKET — never blended with where we had it drawn.
// I tried blending (continue from the drawn position when it was close to the segment's start, snap only
// when far) and it looked WORSE, which is the operator's "the interpolation is pretty ugly now with the
// snapping". The reason is a drift-then-jump sawtooth: the blend branch reset the clock to `now` and threw
// away the segment's AGE, so the entity started every leg a little behind where the server said it already
// was. That deficit accumulated leg after leg until it finally exceeded the snap threshold — and then the
// entity lurched forward. Slow lag, hard jump, repeat.
// There is nothing to blend anyway: consecutive segments CHAIN, because a move's `from` is the previous
// move's `to`. Placing every entity at exactly `from + age·speed` is therefore continuous in normal play
// and jumps ONLY when the server genuinely disagrees with us — which is precisely the snap that was asked
// for, and it needs no threshold to decide it.
function noteMove(e) {
  if (!e.move || !(e.move.speed > 0)) { anim.delete(e.handle); return; }
  const m = e.move, now = performance.now();
  const prev = anim.get(e.handle);
  // Same segment re-sent — keep the original clock so the entity does not restart its walk and crawl.
  if (prev && prev.tx === m.toX && prev.ty === m.toY && prev.fx === m.fromX && prev.fy === m.fromY) return;
  anim.set(e.handle, { fx: m.fromX, fy: m.fromY, tx: m.toX, ty: m.toY, spd: m.speed,
                       t0: now - (m.ageMs || 0) });
}

// SELF is sampled, not evented — we move by our own decision with no packet to hang a time on. So ease
// from wherever we are currently drawn toward each new sample at our own walk speed. Same maths, and it
// turns a 200ms step into continuous motion.
let selfAnim = null, lastSelfAt = 0;
function noteSelfMove(next, prev) {
  if (!next || next.x == null) return;
  const now = performance.now();
  const at = selfPos();                       // where we are DRAWN right now, not the last sample
  const spd = next.walkSpeed > 0 ? next.walkSpeed : 120;
  // Same rule as entities: a jump larger than we could have walked since the last sample is a TELEPORT
  // (a gate, a revive, a MOVEFAIL snap-back), and easing across it would animate a trip we never took.
  if (snapNeeded(at, next.x, next.y, spd, lastSelfAt ? now - lastSelfAt : 0)) {
    selfAnim = { fx: next.x, fy: next.y, tx: next.x, ty: next.y, spd, t0: now };
  } else {
    selfAnim = { fx: at.x, fy: at.y, tx: next.x, ty: next.y, spd, t0: now };
  }
  lastSelfAt = now;
}

// Where a segment says the entity is at this instant. Clamped at the destination — an entity that has
// arrived stays put rather than sailing past it, which is what an uncapped extrapolation would do.
function along(a, now) {
  const dx = a.tx - a.fx, dy = a.ty - a.fy;
  const len = Math.hypot(dx, dy);
  if (!(len > 0) || !(a.spd > 0)) return { x: a.tx, y: a.ty };
  const f = Math.min(1, Math.max(0, ((now - a.t0) / 1000) * a.spd / len));
  return { x: a.fx + dx * f, y: a.fy + dy * f };
}
function selfPos() {
  if (!selfAnim) return null;
  return along(selfAnim, performance.now());
}

// The positions to DRAW: the snapshot, with every animated entity moved to where it actually is now.
// A shallow copy per frame so the underlying snapshot keeps the authoritative destinations — the big map,
// the legend and the distance readouts all still read the real values.
function interpolated(ent) {
  if (!ent) return ent;
  const now = performance.now();
  const view = Object.assign({}, ent);
  if (ent.mobs) view.mobs = ent.mobs.map(m => {
    const a = anim.get(m.handle);
    if (!a) return m;
    const p = along(a, now);
    return Object.assign({}, m, { x: p.x, y: p.y });
  });
  const sp = selfPos();
  if (sp && ent.self) view.self = Object.assign({}, ent.self, { x: sp.x, y: sp.y });
  return view;
}

// ── the render loop ───────────────────────────────────────────────────────────────────────────────
// Drawing only when a packet arrives makes motion as choppy as the packets are; interpolation needs its
// own clock. requestAnimationFrame also stops the work entirely when the tab is hidden.
// THE BIG MAP RENDERS HERE TOO. Feeding its trace from the stream was only half the job: draw() was called from
// tickTrace() and NOWHERE else, so however live the points were, the canvas still repainted once a second and the
// big map visibly lagged the combat map beside it. Same loop, same clock, both maps.
// Throttled rather than per-frame: the big map blits the whole minimap image and up to 20,000 trace points, which
// is real work and does not need 60fps for a walking trace. It repaints only when something actually changed --
// bigMapDirty is set when a point is appended or a poll lands -- so an idle page does nothing.
const BIG_MAP_MIN_MS = 100;
function frame() {
  if (lastEnt) { try { drawCombat(interpolated(lastEnt), evMaxHp); } catch {} }
  const now = Date.now();
  // The throttle exists to stop a 20,000-point trace repainting at 60fps; it must not also delay a map SWAP, which
  // happens once and is exactly the moment the two canvases are compared side by side.
  if (bigMapDirty && (bigMapUrgent || now - lastBigDraw >= BIG_MAP_MIN_MS)) {
    bigMapDirty = false; bigMapUrgent = false; lastBigDraw = now;
    try { draw(serverNow()); } catch {}   // server clock: that is what point timestamps are in
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// THE FALLBACK POLL, and only that. It runs while no stream is delivering — an older host, or a proxy
// that will not upgrade — so the map still works instead of going blank, and stands down the moment
// frames arrive. It is deliberately NOT a periodic backstop under a healthy stream: if something is
// missing from the stream, that is a packet we have not wired, and a poll papering over it would hide
// exactly the gap worth fixing.
async function pollEntities() {
  try {
    const r = await api('/entities');
    if (!r.ok) return;
    const d = await r.json();
    setMapHeader(d.map, d.mapDisplay,
                 d.entities && d.entities.self && d.entities.self.travelTo,
                 d.entities && d.entities.self && d.entities.self.travelToDisplay);
    lastEnt = d.entities; evMaxHp = d.maxHp;
    for (const m of lastEnt.mobs || []) noteMove(m);
  } catch {}
}

function tickCombat() {
  connectStream();
  if (!evAlive) pollEntities();
}
setInterval(tickCombat, 200);   tickCombat();

// COOLDOWN INTERPOLATION, CLIENT-SIDE. Sweeps used to advance only when /metrics landed, so they stepped in
// 2-second jumps. A cooldown is pure arithmetic once you know when it started, and the events that start one --
// skillcast (0x244E) and stones (a USE restarts it) -- now arrive the moment the server confirms them. So run the
// clock here at 60ms and let the poll be nothing but the reconciler: if the two ever disagree, the poll wins and the
// sweep simply snaps, which is the correct precedence.
// Re-renders ONLY the group that is actually cooling, so an idle page does no work and a cooling stone does not
// force the whole skill grid to re-render.
let lastDecayAt = Date.now();
setInterval(() => {
  const now = Date.now(), dt = now - lastDecayAt; lastDecayAt = now;
  if (dt <= 0 || !lastLive) return;
  const decay = list => {
    let cooling = false;
    for (const x of list || []) {
      if (x.remainingMs != null && x.remainingMs > 0) {
        x.remainingMs = Math.max(0, x.remainingMs - dt);
        cooling = true;
      }
    }
    return cooling;
  };
  const decaySkills = decay(lastLive.skills);
  const decayStones = decay(lastLive.stones);
  // IN PLACE, not innerHTML. Rebuilding the grid 16x a second would recreate every <img> icon each frame; the tiles
  // carry a data-cd key so the sweep and the number can be written directly. A full re-render happens only on the
  // cooling -> ready TRANSITION, where the tile's class and layout actually change.
  const paint = (list, kind, render) => {
    let finished = false;
    for (const x of list || []) {
      const key = kind === 'skill' ? `skill:${x.id}` : `stone:${x.kind}`;
      const el = document.querySelector(`[data-cd="${key}"]`);
      if (!el) continue;
      const cd = x.cooldownMs || 0, rem = x.remainingMs;
      if (!cd) continue;
      if (rem != null && rem > 0) {
        const frac = Math.max(0, Math.min(1, rem / cd));
        const sweep = el.querySelector('.sweep');
        if (sweep) sweep.style.background =
          `conic-gradient(rgba(0,0,0,.72) ${frac*360}deg, rgba(0,0,0,0) 0)`;
        const cdEl = el.querySelector('.cd');
        if (cdEl) cdEl.textContent = (rem/1000).toFixed(1);
      } else if (el.classList.contains('cool')) {
        finished = true;   // it just came up: class, sweep and label all change together
      }
    }
    if (finished) render(list);
  };
  if (decaySkills) paint(lastLive.skills, 'skill', skillTiles);
  if (decayStones) paint(lastLive.stones, 'stone', stoneTiles);
}, 60);

// ── quest board ───────────────────────────────────────────────────────────────────────────────────
// Progress is the SERVER's credited count, not our kill tally — a mob dying credits nothing if the
// quest isn't tracking it. A quest missing from client data is shown with `?` rather than hidden,
// because a silent omission would conceal exactly the QuestData decode gaps worth seeing.
// EXP with a thousands separator, as the client shows it: 12345 -> "12.345 EXP".
const expStr = n => !n ? '—' : `${Number(n).toLocaleString('de-DE')} EXP`;

// The DRIVER's own answer to "what are you doing and why" (bot.setFocus -> live.focus). The board's
// order only MIRRORS the driver's sort, so it can look plausible while the driver is on something else
// entirely; this is the one authoritative statement of the current target.
function focusLine(f) {
  if (!f) { $('#focus').innerHTML = '<span class="muted">driver has not reported an intent yet</span>'; return; }
  const stale = f.ageMs > 15000 ? ` <span class="hit-warn">(last said ${Math.round(f.ageMs/1000)}s ago)</span>` : '';
  const q = f.questName ? ` for <b>${f.questName}</b>` : '';
  const dest = f.destination ? ` &rarr; <b>${f.destination}</b>` : '';
  const why = f.reason ? ` <span class="muted">· ${f.reason}</span>` : '';
  $('#focus').innerHTML = `<b>${f.phase || '?'}</b>${dest}${q}${why}${stale}`;
}

// Operator override: clear a quest's flee-deprioritization. The mark's only automatic expiry is a
// level-up, and every mark is written at the level we fled at — so a handful of marks at the current
// level takes the whole board dark and the bot grinds instead of levelling, which is the slowest route
// to the level that would clear them. A human can see a mark is stale; this is how they say so.
// Operator recovery: clean logout → re-login in place, re-applying the same script. Same thing the
// driver's HARD-WEDGE watchdog does automatically after 150s of frozen position AND exp; this is the
// manual handle for when a human can see it is stuck before the watchdog does.
// Confirm first — a relog costs the ring buffer (new handle, new buffer) and ~30s of play.
// CHAT NARRATION TOGGLE. The label always shows the CURRENT state, refreshed from the self sample, so it cannot
// drift out of sync with the bot — including after a reconnect, where this setting used to silently revert.
let announcing = null;
function paintAnnounce(on) {
  announcing = on;
  const b = $("#saybtn");
  if (!b) return;
  b.textContent = on === null ? "say: ?" : (on ? "say: ON" : "say: off");
  b.style.color = on ? "var(--ok)" : "";
}
async function toggleAnnounce() {
  const id = $("#bot").value;
  if (!id) return;
  try {
    const r = await api("/announce", {}, "POST", { enabled: !announcing });
    if (!r.ok) { toast("goal", [id, "say toggle FAILED", `HTTP ${r.status}`]); return; }
    const d = await r.json();
    paintAnnounce(!!d.announcing);
    toast("hand", [id, `chat narration ${d.announcing ? "ON" : "off"}`, "persists across reconnects"]);
  } catch (e) { toast("goal", [id, "say toggle FAILED", e.message]); }
}

async function relogBot() {
  const id = $('#bot').value;
  if (!id) return;
  if (!confirm(`Relog ${id}?\n\nClean logout → re-login → re-apply the script.\n`
             + `Its log buffer will restart EMPTY and it 404s for a few seconds mid-relog.`)) return;
  try {
    const r = await api('/relog', null, 'POST');
    if (!r.ok) { toast('goal', [id, 'relog FAILED', `HTTP ${r.status}`]); return; }
    toast('hand', [id, 'RELOG requested', 'logout → login → re-apply script']);
  } catch (e) { toast('goal', [id, 'relog FAILED', e.message]); }
}

async function undeprio(qid, name) {
  try {
    const r = await api(`/quest/${qid}/undeprioritize`, null, 'POST');
    if (!r.ok) { toast('goal', [name, 'un-deprio FAILED', `HTTP ${r.status}`]); return; }
    const d = await r.json();
    toast('hand', [name, d.clearedMark ? 'Un-deprioritized' : 'had no mark',
                   d.clearedDeathsAtLevel ? `cleared ${d.clearedDeathsAtLevel} death(s) @lvl${d.level}` : `lvl${d.level}`]);
    tickMetrics();
  } catch (e) { toast('goal', [name, 'un-deprio FAILED', e.message]); }
}

function questTable(qs) {
  if (!qs || !qs.length) { $('#quests').innerHTML = ''; $('#qhint').textContent = '· none accepted'; return; }
  const ready = qs.filter(q => q.ready).length;
  const focusId = (lastLive && lastLive.focus && lastLive.focus.questId) || 0;
  // Order MIRRORS the driver's documented sort (ready > no-objection > LOCAL > closer-to-done > exp).
  // It is not the driver's own queue — that lives in the Lua — so it reads as "roughly what's next".
  $('#qhint').textContent = `· ${qs.length} accepted${ready ? ` · ${ready} READY` : ''} · order mirrors the driver's sort`;
  // Goal progress shares the reward column: a goal row's X/Y sits under its quest's exp, so the numbers
  // line up in one narrow column instead of each claiming its own.
  let h = '<colgroup><col class="c-name"><col class="c-num"><col class="c-stat"><col class="c-here"></colgroup>';
  for (const q of qs) {
    const status = q.ready ? '<span class="hit-ok">READY</span>'
                 : q.reason ? `<span class="hit-warn" title="${(q.reasonDetail||q.reason).replace(/"/g,"")}">${q.reason}</span>`
                 : '<span class="muted">working</span>';
    // ★ = the quest the DRIVER says it is on, not the one this table happens to sort first.
    const isFocus = focusId && q.id === focusId;
    // The un-deprio button belongs only on a quest that actually carries a mark; showing it everywhere
    // would invite clicks that do nothing and read as a broken button.
    const undep = q.reason === 'deaths'
      ? ` <button class="mini" onclick="undeprio(${q.id}, '${(q.name||'').replace(/'/g,"\\'")}')" title="Clear the flee-deprioritization and the per-level death count, so the driver re-evaluates this quest now">un-deprio</button>`
      : '';
    h += `<tr class="qh${isFocus ? ' qfocus' : ''}">
            <td>${isFocus ? '<span class="hit-ok" title="the driver says it is working this one">★</span> ' : ''}<b>${q.name}</b>${q.repeatable ? ' <span class="muted">(rep)</span>' : ''}${undep}</td>
            <td>${expStr(q.expReward)}</td>
            <td>${status}</td>
            <td>${q.onCurrentMap ? '<span class="hit-ok">here</span>' : '<span class="muted">—</span>'}</td>
          </tr>`;
    for (const g of (q.goals || [])) {
      const done = g.need > 0 && g.progress >= g.need;
      h += `<tr class="qg">
              <td>&nbsp;&nbsp;&nbsp;${g.kind} ${g.target} <span class="muted">${g.mobId ? `(m${g.mobId})` : (g.itemId ? `(i${g.itemId})` : '')}</span></td>
              <td class="${done ? 'hit-ok' : ''}">${g.progress}/${g.need || '?'}</td>
              <td></td>
              <td>${g.onCurrentMap ? '<span class="hit-ok">here</span>' : ''}</td>
            </tr>`;
    }
    if (!(q.goals || []).length)
      h += `<tr class="qg"><td colspan="4">&nbsp;&nbsp;&nbsp;<span class="muted">no objectives resolved</span></td></tr>`;
  }
  $('#quests').innerHTML = h;
}

// ── death reports (fold-out under the console) ────────────────────────────────────────────────────
// Grouped client-side out of the [death] lines the driver emits. Bounded by whatever is still in the
// log ring, so this is "recent deaths", not an archive — labelled as such rather than implying more.
let deathSeen = new Set();
function renderDeaths(txt) {
  const blocks = []; let cur = null;
  for (const line of txt.split('\n')) {
    const isDeath = line.includes('[death]');
    if (isDeath) {
      if (line.includes('[death] SELF:')) { if (cur) blocks.push(cur); cur = { t: line.slice(0,12), lines: [] }; }
      if (!cur) cur = { t: line.slice(0,12), lines: [] };
      cur.lines.push(line.replace(/^.*\[death\]\s?/, ''));
    }
  }
  if (cur) blocks.push(cur);
  $('#dcount').textContent = blocks.length ? `(${blocks.length} in buffer)` : '(none in buffer)';
  $('#deaths').innerHTML = blocks.reverse().map(b => {
    const head = (b.lines[0] || '').slice(0, 110);
    const esc = t => t.replace(/[&<>]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[ch]));
    return `<details><summary>${b.t} — ${esc(head)}</summary><pre>${esc(b.lines.join('\n'))}</pre></details>`;
  }).join('');
}

// ── toaster ───────────────────────────────────────────────────────────────────────────────────────
// Fired off the log stream, which is where these events are already reported. Each line is keyed by
// its timestamp+text so a re-poll of the same window doesn't re-toast it.
// ⚠️ The hand-in toast shows EXP but NO percentage. The operator asked for
// exp / (nextLevelExp - currLevelExp), and that denominator is NOT available: there is no
// level→exp table in ressystem and no "exp to next level" field anywhere in the PDB protocol
// structs (only EXPGAIN and CurrentExp). Showing a made-up % would be worse than showing none.
// Exp within the current LEVEL band: (exp - PrevExp) / (NextExp - PrevExp), both from
// CHAR_PARAMETER_DATA. This is the same pair the real client's exp bar is drawn from.
function expPct(l) {
  const st = l && l.stats; if (!st || !st.expBand) return null;
  const into = Number(l.exp) - Number(st.prevExp);
  if (!isFinite(into) || into < 0) return null;
  return 100 * into / Number(st.expBand);
}
function expBandText(l) {
  const st = l.stats, p = expPct(l);
  if (!st || !st.expBand) return '<span class="muted">band not known</span>';
  return `${Number(l.exp) - Number(st.prevExp)} / ${st.expBand} <span class="muted">(${p.toFixed(1)}%)</span>`;
}
const toastSeen = new Set();
function toast(kind, parts) {
  const el = document.createElement('div');
  el.className = 'toast ' + kind;
  el.innerHTML = parts.map((p,i) => i ? `<span class="sep">|</span>${p}` : `<span class="q">${p}</span>`).join('');
  $('#toasts').appendChild(el);
  setTimeout(() => { el.style.transition='opacity .4s'; el.style.opacity='0'; setTimeout(()=>el.remove(), 400); }, 6000);
}
function scanEvents(txt) {
  for (const line of txt.split('\n')) {
    if (toastSeen.has(line)) continue;
    // QUEST_MOB_KILL quest=<name> credited (total N)
    let m = line.match(/QUEST_MOB_KILL quest=(.+?) credited \(total (\d+)\)/);
    if (m) {
      toastSeen.add(line);
      const q = questsById.get(m[1]) || questsByName(m[1]);
      const need = q?.need || 0;
      toast('kill', [m[1], lastKilledName || 'enemy', need ? `${m[2]} / ${need}` : `${m[2]}`]);
      if (need && Number(m[2]) >= need) toast('goal', [m[1], 'Goals Reached']);
      continue;
    }
    m = line.match(/\[lq\] ENGAGE (.+?) h=/) || line.match(/\[combat\] KILLED (.+?) /);
    if (m) { lastKilledName = m[1]; }
    m = line.match(/(.+?) HANDED IN /);
    if (m && line.includes('CRUTCH')) {
      toastSeen.add(line);
      const nm = m[1].replace(/^.*CRUTCH\[OK\]\s*/, '');
      const q = questsByName(nm);
      // % of the CURRENT LEVEL this reward is worth — exp / (NextExp - PrevExp), as asked for.
      const band = lastLive?.stats?.expBand || 0;
      const pct = (q?.expReward && band) ? ` (${(100*q.expReward/Number(band)).toFixed(1)}%)` : '';
      toast('hand', [nm, 'Handed In', q?.expReward ? `${q.expReward} EXP${pct}` : 'reward granted']);
    }
  }
  if (toastSeen.size > 4000) toastSeen.clear();
}
let lastKilledName = null, lastLive = null, lastEnt = null;
let questsById = new Map(), questList = [];
function questsByName(n) { return questList.find(q => q.name === n); }
</script>
