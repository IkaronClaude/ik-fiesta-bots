name: build-bot-host-image

# CI/CD for the 24/7 bot host (Argo app fiesta-bot-host, ns fiesta).
# On push to main: build ./Dockerfile, push ghcr.io/<owner>/fiesta-bot-host:<sha>,
# then bump the image tag in the gitops repo so Argo deploys it.
# The GHCR package must be linked to this repo (so GITHUB_TOKEN can push) — done
# by the operator 2026-07-28. The manifest-update job needs an ARGO_REPO_PAT secret
# (a PAT with write access to Ikaron/gitops).

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: build-bot-host-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive   # lib/FiestaLib-Reloaded is a submodule the build needs

      - name: Lower-case owner
        run: echo "OWNER_LC=${OWNER,,}" >> "$GITHUB_ENV"
        env: { OWNER: '${{ github.repository_owner }}' }

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/${{ env.OWNER_LC }}/fiesta-bot-host:${{ github.sha }}

  update-manifest:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Lower-case owner
        run: echo "OWNER_LC=${OWNER,,}" >> "$GITHUB_ENV"
        env: { OWNER: '${{ github.repository_owner }}' }

      - name: Checkout gitops repo
        uses: actions/checkout@v4
        with:
          repository: Ikaron/gitops
          token: ${{ secrets.ARGO_REPO_PAT }}
          path: gitops

      - name: Bump image tag in the bots manifest
        run: |
          sed -i "s|image: ghcr.io/.*fiesta-bot-host:.*|image: ghcr.io/${OWNER_LC}/fiesta-bot-host:${{ github.sha }}|g" \
            gitops/workloads/fiesta-bots/bots.yaml

      - name: Commit + push
        run: |
          cd gitops
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add workloads/fiesta-bots/bots.yaml
          git diff --cached --quiet || git commit -m "chore(deploy): fiesta-bot-host image -> ${{ github.sha }} [skip ci]"
          git push
